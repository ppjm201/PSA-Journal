const FACTOR_GROUPS = {
  exercise: ["days with exercise", "rest days"],
  alcohol:  ["days after drinking", "other days"],
  sleep:    ["nights under 6h", "nights of 7h or more"],
  stress:   ["high-stress days", "low-stress days"],
  skin:     ["days the skin flared", "clear-skin days"],
  pms:      ["PMS days", "mid-cycle days"],
  period:   ["period days", "mid-cycle days"],
};

function Badge({ ok }) {
  return (
    <span style={{ fontSize:10, fontWeight:700, letterSpacing:.3, borderRadius:20, padding:"2px 8px",
      background: ok ? "#E8F5E9" : "#F5F0EB", color: ok ? "#2C5F4A" : "#9a9189", whiteSpace:"nowrap" }}>
      {ok ? "clear signal" : "not yet clear"}
    </span>
  );
}

function EffectBar({ diff }) {
  return (
    <div style={{ width:64, height:6, background:"#F0E8E0", borderRadius:3, overflow:"hidden" }}>
      <div style={{ width:`${Math.min(100, (Math.abs(diff) / 2) * 100)}%`, height:"100%",
        background: diff > 0 ? "#EF5350" : "#4CAF50", borderRadius:3 }}/>
    </div>
  );
}

function FactorRow({ label, st, groupA, groupB, note }) {
  const worse = st.diff > 0;
  const colour = !st.reliable ? "#9a9189" : worse ? "#C62828" : "#2C5F4A";
  return (
    <div style={{ padding:"11px 0", borderBottom:"1px solid #F0E8E0" }}>
      <div style={{ display:"flex", alignItems:"center", gap:8, marginBottom:4 }}>
        <span style={{ fontSize:13.5, fontWeight:600, color:"#1e3d2f", flex:1 }}>{label}</span>
        <Badge ok={st.reliable}/>
        <EffectBar diff={st.diff}/>
        <span style={{ fontSize:14, fontWeight:800, color:colour, minWidth:40, textAlign:"right" }}>
          {signed(st.diff)}
        </span>
      </div>
      <div style={{ fontSize:11.5, color:"#9a9189", lineHeight:1.55 }}>
        {st.m1.toFixed(1)} across {st.n1} {groupA} vs {st.m2.toFixed(1)} across {st.n2} {groupB}
        {note ? ` · ${note}` : ""} · {ciText(st)}
      </div>
    </div>
  );
}

// `deltaInverted` marks the metrics where a rise is bad news, so the colour of a
// change doesn't have to be decided at every call site.
function StatBox({ label, value, sub, color="#2C5F4A", bg="#E8F5E9", delta, deltaInverted }) {
  let deltaEl = null;
  if (delta !== undefined && delta !== null) {
    const flat = Math.abs(delta) < MIN_EFFECT;
    const better = !flat && (deltaInverted ? delta < 0 : delta > 0);
    const dColor = flat ? "#9a9189" : better ? "#2C5F4A" : "#C62828";
    deltaEl = (
      <div style={{ fontSize:10, color:dColor, marginTop:3, fontWeight:600 }}>
        {flat ? "→" : delta > 0 ? "↑" : "↓"} {signed(delta)} vs prior
      </div>
    );
  }
  return (
    <div style={{ flex:1, background:bg, borderRadius:12, padding:"14px 12px", textAlign:"center" }}>
      <div style={{ fontSize:26, fontWeight:800, fontFamily:"'Lora',serif", color, lineHeight:1 }}>{value}</div>
      <div style={{ fontSize:12, color, marginTop:4, fontWeight:600 }}>{label}</div>
      {sub && <div style={{ fontSize:11, color:"#9a9189", marginTop:2 }}>{sub}</div>}
      {deltaEl}
    </div>
  );
}

function InsightsTab({ logs, onEditEntry, onAddMissedDay, prefs }) {
  const n = logs.length;
  const [reportOpen, setReportOpen] = useState(false);
  const [reportStart, setReportStart] = useState("");
  const [reportEnd, setReportEnd] = useState("");
  const [patientName, setPatientName] = useState("");
  const [generating, setGenerating] = useState(false);

  const setPreset = (months) => {
    const today = parseDate(todayStr());
    const start = new Date(today);
    start.setMonth(start.getMonth() - months);
    setReportEnd(dateStrOf(today));
    setReportStart(dateStrOf(start));
  };
  const openReport = () => { setPreset(3); setReportOpen(true); };

  const handleGenerate = () => {
    if (!reportStart || !reportEnd || reportStart > reportEnd) {
      alert("Pick a start date that falls before the end date.");
      return;
    }
    if (!window.jspdf) {
      alert("The PDF library hasn't loaded. Check the connection and refresh, then try again.");
      return;
    }
    setGenerating(true);
    setTimeout(() => {
      try {
        const doc = generateDoctorReport(logs, {
          startDate: reportStart, endDate: reportEnd, patientName: patientName.trim(),
        });
        doc.save(`psa-report-${reportStart}-to-${reportEnd}.pdf`);
        setReportOpen(false);
      } catch (err) {
        alert("The report didn't generate. " + (err.message || ""));
      } finally {
        setGenerating(false);
      }
    }, 50);
  };

  if (n < 5) return (
    <div style={{ padding:"36px 0" }}>
      <div style={{ textAlign:"center", marginBottom:24 }}>
        <div style={{ fontFamily:"'Lora',serif", fontSize:20, color:"#1e3d2f", marginBottom:8 }}>
          Building the picture
        </div>
        <div style={{ fontSize:14, color:"#9a9189", lineHeight:1.7, maxWidth:300, margin:"0 auto" }}>
          Insights open up after five entries. There {n === 1 ? "is" : "are"} {n} so far.
        </div>
      </div>
      <Card style={{ background:"#F5F0EB", border:"none" }}>
        <div style={{ fontFamily:"'Lora',serif", fontWeight:700, marginBottom:8, color:"#1e3d2f" }}>What appears here</div>
        <ul style={{ margin:0, padding:"0 0 0 18px", fontSize:13, color:"#7a7069", lineHeight:2 }}>
          <li>Pain, fatigue and skin over time</li>
          <li>Which joints carry the most of it</li>
          <li>How exercise, sleep, alcohol and stress compare</li>
          <li>Foods checked at same-day, next-day and two-day lags</li>
          <li>A PDF for the rheumatologist</li>
        </ul>
      </Card>
    </div>
  );

  const fmt = v => (v === null ? "–" : v.toFixed(1));

  // Rolling 28-day windows: the last 28 days (excluding today) against the 28
  // before that. Both need enough entries before any of it is shown.
  const today = todayStr();
  const inWindow = (dateStr, fromDaysAgo, toDaysAgo) => {
    const diff = daysBetween(dateStr, today);
    return diff >= toDaysAgo && diff <= fromDaysAgo;
  };
  const recentEntries = logs.filter(l => inWindow(l.date, 28, 1));
  const priorEntries  = logs.filter(l => inWindow(l.date, 56, 29));
  const trendReliable = recentEntries.length >= 14 && priorEntries.length >= 14;

  const trendMetrics = [
    { key:"overallPain", label:"Pain" },
    { key:"fatigue",     label:"Fatigue" },
    { key:"skinFlare",   label:"Skin" },
    { key:"morning",     label:"Morning stiffness", max:3, filter: l => l.morning >= 1 },
  ].map(m => {
    const pick = arr => (m.filter ? arr.filter(m.filter) : arr).map(l => l[m.key] || 0);
    const r = pick(recentEntries), p = pick(priorEntries);
    if (r.length < 5 || p.length < 5) return null;
    const recent = mean(r), prior = mean(p);
    const diff = +(recent - prior).toFixed(2);
    const threshold = m.max === 3 ? 0.2 : MIN_EFFECT;
    return {
      ...m, recent:+recent.toFixed(1), prior:+prior.toFixed(1), diff, nR:r.length, nP:p.length,
      dir: Math.abs(diff) < threshold ? "stable" : diff < 0 ? "improving" : "worsening",
    };
  }).filter(Boolean);

  const deltaOf = (key) => {
    if (!trendReliable) return null;
    const r = mean(recentEntries.map(l => l[key] || 0));
    const p = mean(priorEntries.map(l => l[key] || 0));
    return r === null || p === null ? null : +(r - p).toFixed(1);
  };

  const patterns   = factorPatterns(logs);
  const shownPatterns = patterns.filter(p => prefs?.trackCycle || (p.key !== "pms" && p.key !== "period"));
  const foods      = foodLagInsights(logs);
  const reliableFoods = foods.filter(f => f.reliable);
  const unclearFoods  = foods.filter(f => !f.reliable);
  const weather    = weatherInsights(logs);
  const reliableWeather = weather.filter(w => w.reliable);
  const byType     = exerciseTypeInsights(logs);
  const joints     = jointBurdens(logs).slice(0, 6);
  const cycle      = prefs?.trackCycle ? buildCyclePhases(logs) : null;

  const morningCounts = [0,0,0,0];
  logs.forEach(l => { if (l.morning >= 1 && l.morning <= 3) morningCounts[l.morning]++; });
  const morningLogged = morningCounts[1] + morningCounts[2] + morningCounts[3];
  const stiffRecent = trendReliable ? stiffPct(recentEntries) : null;
  const stiffPrior  = trendReliable ? stiffPct(priorEntries)  : null;
  const deltaStiff  = stiffRecent !== null && stiffPrior !== null ? Math.round(stiffRecent - stiffPrior) : null;

  return (
    <div>
      <button onClick={openReport} style={{
        width:"100%", padding:"14px 0", marginBottom:14,
        background:"#fff", color:"#2C5F4A", border:"2px solid #2C5F4A", borderRadius:13,
        fontSize:14, fontFamily:"'Lora',serif", fontWeight:700, cursor:"pointer",
        display:"flex", alignItems:"center", justifyContent:"center", gap:8 }}>
        <span style={{ fontSize:18 }} aria-hidden="true">📋</span>
        <span>Make a report for the doctor (PDF)</span>
      </button>

      {reportOpen && (
        <div onClick={() => !generating && setReportOpen(false)} style={{
          position:"fixed", inset:0, background:"rgba(30,61,47,.5)",
          display:"flex", alignItems:"center", justifyContent:"center", padding:16, zIndex:200 }}>
          <div onClick={e => e.stopPropagation()} role="dialog" aria-label="Report options" style={{
            background:"#fff", borderRadius:16, padding:"22px 22px 18px",
            maxWidth:400, width:"100%", boxShadow:"0 10px 40px rgba(0,0,0,.25)" }}>
            <div style={{ fontFamily:"'Lora',serif", fontWeight:700, fontSize:18, color:"#1e3d2f", marginBottom:6 }}>
              Report for the doctor
            </div>
            <div style={{ fontSize:12, color:"#9a9189", marginBottom:18, lineHeight:1.5 }}>
              A few pages of summary, joints, patterns and a day-by-day table — printable or emailable.
            </div>

            <div style={{ marginBottom:14 }}>
              <div style={{ fontSize:12, color:"#7a7069", marginBottom:6, fontWeight:600 }}>Period covered</div>
              <div style={{ display:"flex", gap:6, marginBottom:10 }}>
                {[1,3,6,12].map(m => (
                  <button key={m} onClick={() => setPreset(m)} style={{
                    flex:1, padding:"7px 0", borderRadius:8, border:"1.5px solid #E2D9CE",
                    background:"#FAF7F2", color:"#7a7069", cursor:"pointer", fontSize:12, fontWeight:600 }}>
                    {m === 12 ? "1y" : `${m}m`}
                  </button>
                ))}
              </div>
              <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                <input type="date" value={reportStart} max={reportEnd} aria-label="Report start date"
                  onChange={e => setReportStart(e.target.value)}
                  style={{ flex:1, padding:"8px 10px", borderRadius:8, border:"1.5px solid #E2D9CE",
                    background:"#FAF7F2", fontSize:13, color:"#1e3d2f", fontFamily:"inherit", outline:"none" }}/>
                <span style={{ fontSize:12, color:"#9a9189" }}>to</span>
                <input type="date" value={reportEnd} max={todayStr()} min={reportStart} aria-label="Report end date"
                  onChange={e => setReportEnd(e.target.value)}
                  style={{ flex:1, padding:"8px 10px", borderRadius:8, border:"1.5px solid #E2D9CE",
                    background:"#FAF7F2", fontSize:13, color:"#1e3d2f", fontFamily:"inherit", outline:"none" }}/>
              </div>
            </div>

            <div style={{ marginBottom:18 }}>
              <div style={{ fontSize:12, color:"#7a7069", marginBottom:6, fontWeight:600 }}>
                Name on the report <span style={{ color:"#9a9189", fontWeight:400 }}>(optional)</span>
              </div>
              <input type="text" value={patientName} onChange={e => setPatientName(e.target.value)}
                placeholder="Leave blank to omit" aria-label="Name on the report"
                style={{ width:"100%", padding:"8px 10px", borderRadius:8, border:"1.5px solid #E2D9CE",
                  background:"#FAF7F2", fontSize:13, color:"#1e3d2f", fontFamily:"inherit", outline:"none" }}/>
            </div>

            <div style={{ display:"flex", gap:10 }}>
              <button onClick={() => setReportOpen(false)} disabled={generating} style={{
                flex:1, padding:"11px 0", borderRadius:10, border:"1.5px solid #E2D9CE",
                background:"#fff", color:"#7a7069", cursor: generating ? "not-allowed" : "pointer",
                fontSize:13, fontWeight:600, opacity: generating ? .5 : 1 }}>Cancel</button>
              <button onClick={handleGenerate} disabled={generating} style={{
                flex:2, padding:"11px 0", borderRadius:10, border:"none",
                background: generating ? "#9aa39c" : "#2C5F4A", color:"#fff",
                cursor: generating ? "wait" : "pointer", fontSize:13, fontWeight:700,
                fontFamily:"'Lora',serif" }}>
                {generating ? "Making the PDF…" : "Download PDF"}
              </button>
            </div>
          </div>
        </div>
      )}

      <Card title="Pain trend" emoji="📈">
        <PainTrendChart logs={logs}/>
      </Card>

      <Card title="Calendar" emoji="🗓️">
        <CalendarHeatmap logs={logs} onEditEntry={onEditEntry} onAddMissedDay={onAddMissedDay}/>
      </Card>

      {n >= 14 && !trendReliable && (
        <Card title="Month on month" emoji="📉" style={{ background:"#F5F0EB", border:"1.5px dashed #C9BBAB" }}>
          <p style={{ fontSize:13, color:"#1e3d2f", lineHeight:1.6, margin:"0 0 10px" }}>
            This comparison needs about <strong>eight weeks</strong> of entries, so the last month can be
            weighed against the month before it.
          </p>
          <div style={{ background:"#fff", borderRadius:9, padding:"10px 12px" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:6 }}>
              <span style={{ fontSize:12, color:"#7a7069" }}>Entries so far</span>
              <span style={{ fontSize:12, fontWeight:700, color:"#2C5F4A" }}>{n} / 56</span>
            </div>
            <div style={{ height:8, background:"#F0E8E0", borderRadius:4, overflow:"hidden" }}>
              <div style={{ width:`${Math.min(100,(n/56)*100)}%`, height:"100%",
                background:"linear-gradient(to right,#81C784,#2C5F4A)", borderRadius:4, transition:"width .3s" }}/>
            </div>
          </div>
        </Card>
      )}

      {trendReliable && trendMetrics.length > 0 && (
        <Card title="Month on month" emoji="📉">
          <p style={{ fontSize:12, color:"#9a9189", margin:"0 0 12px", lineHeight:1.6 }}>
            The last 28 days against the 28 before them.
          </p>
          {trendMetrics.map(m => {
            const arrow = m.dir === "improving" ? "↘" : m.dir === "worsening" ? "↗" : "→";
            const colour = m.dir === "improving" ? "#2C5F4A" : m.dir === "worsening" ? "#C62828" : "#9a9189";
            return (
              <div key={m.key} style={{ display:"flex", alignItems:"center", gap:12, padding:"10px 0",
                borderBottom:"1px solid #F0E8E0" }}>
                <div style={{ flex:1 }}>
                  <div style={{ fontSize:13, fontWeight:600, color:"#1e3d2f" }}>{m.label}</div>
                  <div style={{ fontSize:11, color:"#9a9189", marginTop:2 }}>
                    {m.recent} now · {m.prior} the month before
                    {m.filter ? ` · ${m.nR} and ${m.nP} days answered` : ""}
                  </div>
                </div>
                <span style={{ fontSize:22, fontWeight:800, color:colour, lineHeight:1 }}>{arrow}</span>
                <div style={{ textAlign:"right", minWidth:54 }}>
                  <div style={{ fontSize:14, fontWeight:700, color:colour, lineHeight:1 }}>{signed(m.diff)}</div>
                  <div style={{ fontSize:10, color:"#9a9189", marginTop:3, textTransform:"capitalize" }}>{m.dir}</div>
                </div>
              </div>
            );
          })}
          <Caveat>
            Based on {recentEntries.length} recent and {priorEntries.length} earlier days.
            Movements under {MIN_EFFECT} of a point are treated as noise.
          </Caveat>
        </Card>
      )}

      <Card title="Daily averages" emoji="🌡️">
        <div style={{ display:"flex", gap:10 }}>
          <StatBox label="Pain"    value={fmt(mean(logs.map(l => l.overallPain || 0)))} sub="overall"
            color={pf(3)} bg={pb(3)} delta={deltaOf("overallPain")} deltaInverted/>
          <StatBox label="Fatigue" value={fmt(mean(logs.map(l => l.fatigue || 0)))} sub="0–5"
            color="#6A4C93" bg="#EFE6F5" delta={deltaOf("fatigue")} deltaInverted/>
          <StatBox label="Skin"    value={fmt(mean(logs.map(l => l.skinFlare || 0)))} sub="0–5"
            color="#B85C38" bg="#FFF0E8" delta={deltaOf("skinFlare")} deltaInverted/>
        </div>
        <Caveat>
          Across all {n} entries.{trendReliable ? " The smaller figure compares the last 28 days with the 28 before them." : ""}
        </Caveat>
      </Card>

      {morningLogged >= 3 && (
        <Card title="Morning stiffness" emoji="🌅">
          <div style={{ display:"flex", gap:10, marginBottom:12 }}>
            {[1,2,3].map(v => (
              <StatBox key={v} label={MORNING_LBLS[v]} value={morningCounts[v]}
                sub={`${Math.round((morningCounts[v]/morningLogged)*100)}% of mornings`}
                color={MORNING_FG[v]} bg={MORNING_BG[v]}/>
            ))}
          </div>
          {deltaStiff !== null && (
            <div style={{ padding:"10px 12px", marginBottom:10, borderRadius:9,
              background: Math.abs(deltaStiff) < 5 ? "#F5F0EB" : deltaStiff < 0 ? "#E8F5E9" : "#FFEBEE",
              fontSize:13, color:"#1e3d2f", lineHeight:1.5 }}>
              Stiff-or-worse mornings: <strong>{Math.round(stiffRecent)}%</strong> in the last 28 days
              against {Math.round(stiffPrior)}% in the 28 before
              {Math.abs(deltaStiff) < 5 ? " — broadly unchanged." : deltaStiff < 0 ? " — an improvement." : " — worth mentioning."}
            </div>
          )}
          <Caveat>
            Counted across the {morningLogged} mornings that were answered; blank mornings are left out
            rather than counted as fine.
          </Caveat>
        </Card>
      )}

      {shownPatterns.length > 0 && (
        <Card title="What seems to move it" emoji="🔍">
          <p style={{ fontSize:12, color:"#9a9189", margin:"0 0 6px", lineHeight:1.6 }}>
            Each line compares the days something applied with the days it didn't. Alcohol is also
            tested a day and two days out, since it often lands late.
          </p>
          {shownPatterns.map(p => (
            <FactorRow key={p.key} label={p.label} st={p.st}
              groupA={FACTOR_GROUPS[p.key] ? FACTOR_GROUPS[p.key][0] : "days"}
              groupB={FACTOR_GROUPS[p.key] ? FACTOR_GROUPS[p.key][1] : "other days"}
              note={p.st.lag !== undefined ? `strongest ${lagLabel(p.st.lag)}` : null}/>
          ))}
          <Caveat>
            A line is only called a clear signal when the 95% confidence interval stays on one side of
            zero. Everything here is an association within one person's diary, not a cause.
          </Caveat>
        </Card>
      )}

      {joints.length > 0 && (
        <Card title="Most affected joints" emoji="🦴">
          <p style={{ fontSize:12, color:"#9a9189", margin:"0 0 12px", lineHeight:1.5 }}>
            Ranked by <strong>pain burden</strong> — total pain spread across every day logged, so
            frequency and severity both count.
          </p>
          {(() => {
            const maxBurden = Math.max(...joints.map(j => j.burden), 0.01);
            return joints.map(j => (
              <div key={j.id} style={{ display:"flex", alignItems:"center", gap:10, marginBottom:14 }}>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontSize:13, color:"#1e3d2f", fontWeight:500 }}>{j.label}</div>
                  <div style={{ fontSize:11, color:"#9a9189", marginTop:2 }}>
                    Painful on {j.days} of {n} days ({j.freqPct}%) · {j.avgWhenPainful.toFixed(1)} when it hurt
                    {j.swelling > 0 ? ` · swollen ${j.swelling}d` : ""}
                  </div>
                </div>
                <div style={{ flex:1.1, display:"flex", alignItems:"center", gap:8 }}>
                  <div style={{ flex:1, height:8, background:"#F0E8E0", borderRadius:4, overflow:"hidden" }}>
                    <div style={{ width:`${(j.burden/maxBurden)*100}%`, height:"100%",
                      background:"linear-gradient(to right,#81C784,#EF5350)", borderRadius:4 }}/>
                  </div>
                  <span style={{ fontSize:13, fontWeight:800, color:pf(Math.round(j.avgWhenPainful)),
                    width:36, textAlign:"right" }}>{j.burden.toFixed(2)}</span>
                </div>
              </div>
            ));
          })()}
        </Card>
      )}

      {byType.length > 0 && (
        <Card title="Which activities" emoji="🏃">
          <p style={{ fontSize:12, color:"#9a9189", margin:"0 0 10px", lineHeight:1.6 }}>
            Each activity against every other day, whether that was rest or something else. Only types
            with at least {MIN_GROUP} days on both sides appear.
          </p>
          {byType.map(r => (
            <FactorRow key={r.type} label={r.type} st={r}
              groupA={`days doing it`} groupB={`other days`}/>
          ))}
        </Card>
      )}

      {prefs?.trackCycle && cycle && (
        <Card title="Cycle and pain" emoji="🩸">
          <p style={{ fontSize:12, color:"#9a9189", margin:"0 0 12px", lineHeight:1.6 }}>
            Phases worked out from the day-1 markers — {cycle.cyclesTracked} recorded
            {cycle.cycleLen ? `, median ${cycle.cycleLen} days apart` : ""}.
          </p>
          <div style={{ display:"flex", gap:10, marginBottom:12 }}>
            {cycle.pms && (
              <StatBox label="PMS (last 5d)" value={fmt(cycle.pms.avg)} sub={`${cycle.pms.n} days`}
                color={cycle.pms.avg > cycle.midcycle.avg ? "#C2185B" : "#2C5F4A"}
                bg={cycle.pms.avg > cycle.midcycle.avg ? "#FCE4EC" : "#E8F5E9"}/>
            )}
            {cycle.menstruation && (
              <StatBox label="Period" value={fmt(cycle.menstruation.avg)} sub={`${cycle.menstruation.n} days`}
                color={cycle.menstruation.avg > cycle.midcycle.avg ? "#C2185B" : "#2C5F4A"}
                bg={cycle.menstruation.avg > cycle.midcycle.avg ? "#FCE4EC" : "#E8F5E9"}/>
            )}
            <StatBox label="Mid-cycle" value={fmt(cycle.midcycle.avg)} sub={`${cycle.midcycle.n} days`}
              color="#2C5F4A" bg="#E8F5E9"/>
          </div>
          {cycle.pmsVsMid && (
            <FactorRow label="PMS vs mid-cycle" st={cycle.pmsVsMid} groupA="PMS days" groupB="mid-cycle days"/>
          )}
          {cycle.periodVsMid && (
            <FactorRow label="Period vs mid-cycle" st={cycle.periodVsMid} groupA="period days" groupB="mid-cycle days"/>
          )}
          <Caveat>
            {cycle.projectionUsed
              ? "Days since the last day-1 marker are placed using the median cycle length so far, so they'll firm up when the next period is logged. "
              : ""}
            Two or three full cycles is the point at which this starts to mean much.
          </Caveat>
        </Card>
      )}

      {foods.length > 0 && (
        <Card title="Food correlations" emoji="🍽️">
          <p style={{ fontSize:12, color:"#9a9189", margin:"0 0 10px", lineHeight:1.6 }}>
            Every food is checked same-day, next-day and two days later; the strongest of the three is
            shown. Positive means more pain.
          </p>
          {reliableFoods.length > 0 ? reliableFoods.map(f => (
            <FactorRow key={f.id} label={`${f.emoji} ${f.label}`} st={f}
              groupA="days eaten" groupB="days not" note={`strongest ${lagLabel(f.lag)}`}/>
          )) : (
            <div style={{ padding:"12px 14px", background:"#F5F0EB", borderRadius:9,
              fontSize:13, color:"#1e3d2f", lineHeight:1.6 }}>
              Nothing separates from ordinary day-to-day variation yet.
            </div>
          )}
          {unclearFoods.length > 0 && (
            <div style={{ marginTop:14 }}>
              <SubLabel>Checked, nothing clear</SubLabel>
              <div style={{ fontSize:12, color:"#9a9189", lineHeight:1.7 }}>
                {unclearFoods.map(f => `${f.label} (${signed(f.diff)})`).join(" · ")}
              </div>
            </div>
          )}
          <Caveat>
            Around {foods.length * 3} food-and-timing combinations get tested here, so one or two will
            look meaningful by luck alone. The only way to settle a suspicion is to drop the food and
            reintroduce it deliberately — worth planning with the rheumatologist or a dietitian, since
            cutting things out on the strength of a chart tends to narrow a diet without helping.
          </Caveat>
        </Card>
      )}

      {reliableWeather.length > 0 && (
        <Card title="Weather" emoji="🌤️">
          {reliableWeather.map(w => (
            <FactorRow key={w.label} label={w.label} st={w} groupA="such days" groupB="other days"/>
          ))}
          <Caveat>
            Weather isn't something to act on, but it's useful for telling a bad week apart from a bad
            spell of weather. {weather.length - reliableWeather.length} other condition
            {weather.length - reliableWeather.length === 1 ? "" : "s"} showed nothing clear.
          </Caveat>
        </Card>
      )}

      <Card style={{ background:"#F5F0EB", border:"none" }}>
        <div style={{ fontFamily:"'Lora',serif", fontWeight:700, color:"#1e3d2f", marginBottom:6 }}>
          Taking this to an appointment
        </div>
        <div style={{ fontSize:13, color:"#7a7069", lineHeight:1.7 }}>
          These are patterns in one person's diary, not medical advice, and a diary can't tell disease
          activity apart from a bad month. The PDF at the top of this tab is the version to hand over —
          it carries the same numbers with their confidence intervals, which is what makes them
          interpretable.
        </div>
      </Card>
    </div>
  );
}

function downloadFile(text, filename, type) {
  const blob = new Blob([text], { type });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);   // revoking immediately can cancel the download
}

function PsATracker() {
  const [tab,     setTab]     = useState("log");
  const [log,     setLog]     = useState(emptyLog());
  const [logs,    setLogs]    = useState([]);
  const [saveMsg, setSaveMsg] = useState("");
  const [prefs,   setPrefs]   = useState(DEFAULT_PREFS);

  useEffect(() => {
    window.__psaBooted = true;
    clearTimeout(window.__psaBootTimer);
    setPrefs(readPrefs());
    const stored = readLogs();
    if (stored.length) {
      setLogs(stored);
      const todayEntry = stored.find(l => l.date === todayStr());
      if (todayEntry) setLog(hydrate(todayEntry));
    }
  }, []);

  const updatePrefs = (changes) => {
    const next = { ...prefs, ...changes };
    setPrefs(next);
    writePrefs(next);
  };

  const persist = (updated) => {
    const ok = writeLogs(updated);
    setLogs(updated);
    if (!ok) alert("This entry is in the app but couldn't be written to storage, so it won't survive a refresh. Export a backup to keep it.");
    return ok;
  };

  const onSave = () => {
    const entry = sanitiseEntry(log) || hydrate(log);
    persist([...logs.filter(l => l.date !== entry.date), entry].sort((a,b) => a.date.localeCompare(b.date)));
    setLog(entry);
    setSaveMsg("Saved ✓");
    setTimeout(() => setSaveMsg(""), 2500);
  };

  const onEditEntry = (date) => {
    const entry = logs.find(l => l.date === date);
    if (!entry) return;
    setLog(hydrate(entry));
    setTab("log");
    window.scrollTo({ top:0, behavior:"smooth" });
  };

  const onAddMissedDay = (date) => {
    if (!isValidDateStr(date)) return;
    if (date > todayStr()) { alert("That date is in the future — pick today or earlier."); return; }
    if (logs.some(l => l.date === date)) { onEditEntry(date); return; }
    setLog({ ...emptyLog(), date });
    setTab("log");
    window.scrollTo({ top:0, behavior:"smooth" });
  };

  const onDeleteEntry = (date) => {
    if (!confirm(`Delete the entry for ${fmtLong(date)}? This can't be undone.`)) return;
    persist(logs.filter(l => l.date !== date));
    if (log.date === date) setLog(emptyLog());
  };

  const onResetToToday = () => {
    const todayEntry = logs.find(l => l.date === todayStr());
    setLog(todayEntry ? hydrate(todayEntry) : emptyLog());
  };

  const onLoadDemo = () => {
    const proceed = logs.length === 0
      ? confirm("Load 60 days of invented entries? It shows what the insights and the PDF look like with a full diary behind them, and can be wiped afterwards.")
      : confirm(`There are already ${logs.length} entries here. Demo days will overwrite any real entry that falls on the same date.\n\nExport a backup first.\n\nContinue?`);
    if (!proceed) return;
    const demo = generateDemoData();
    persist(sanitiseLogs([...logs, ...demo]));
    setLog(emptyLog());
    setTab("insights");
  };

  const onWipeAll = () => {
    if (!confirm(`This deletes all ${logs.length} entries and can't be undone.\n\nExport a backup first.\n\nSure?`)) return;
    if (!confirm("Last chance — wipe everything?")) return;
    persist([]);
    setLog(emptyLog());
    setTab("log");
  };

  const onExport = () => {
    const payload = { app:"PsA Journal", version:2, exportedAt:new Date().toISOString(), prefs, logs };
    downloadFile(JSON.stringify(payload, null, 2), `psa-journal-${todayStr()}.json`, "application/json");
  };

  const onExportCsv = () => {
    const header = ["date","pain","morning","fatigue","skin","stress","sleep_hours","alcohol_units",
      "exercise","exercise_minutes","on_period","period_day_1","painful_joints","swollen_joints",
      "foods","weather","notes"];
    const esc = v => {
      const s = String(v === null || v === undefined ? "" : v);
      return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
    };
    const rows = logs.map(l => [
      l.date, l.overallPain, l.morning ? MORNING_LBLS[l.morning] : "", l.fatigue, l.skinFlare,
      l.stress, l.sleep, l.alcohol,
      getExercises(l).join("; "), getTotalExerciseMins(l),
      l.onPeriod ? "yes" : "", l.periodStart ? "yes" : "",
      Object.entries(l.joints || {}).filter(([, v]) => v > 0)
        .map(([id, v]) => `${JOINT_LABEL(id)} ${v}`).join("; "),
      Object.keys(l.swelling || {}).filter(k => l.swelling[k]).map(JOINT_LABEL).join("; "),
      (l.foods || []).map(id => (ALL_FOODS.find(f => f.id === id) || { label:id }).label).join("; "),
      (l.weather || []).join("; "),
      l.notes || "",
    ].map(esc).join(","));
    // The BOM keeps Excel from mangling the emoji in the weather column.
    downloadFile("\uFEFF" + [header.join(","), ...rows].join("\r\n"),
      `psa-journal-${todayStr()}.csv`, "text/csv;charset=utf-8");
  };

  const onImport = (file) => {
    const reader = new FileReader();
    reader.onload = e => {
      let parsed;
      try { parsed = JSON.parse(e.target.result); }
      catch { alert("That file isn't readable JSON. Use a backup exported from this app."); return; }
      const incoming = Array.isArray(parsed) ? parsed : Array.isArray(parsed.logs) ? parsed.logs : null;
      if (!incoming) { alert("No entries found in that file."); return; }
      const cleaned = sanitiseLogs(incoming);
      if (!cleaned.length) { alert("No usable entries in that file."); return; }
      const overlap = cleaned.filter(c => logs.some(l => l.date === c.date)).length;
      if (overlap && !confirm(`${cleaned.length} entries found. ${overlap} fall on dates already logged and will replace what's there. Continue?`)) return;
      const merged = sanitiseLogs([...logs, ...cleaned]);
      persist(merged);
      if (parsed && parsed.prefs && typeof parsed.prefs === "object") updatePrefs(parsed.prefs);
      const todayEntry = merged.find(l => l.date === todayStr());
      setLog(todayEntry ? hydrate(todayEntry) : emptyLog());
      alert(`Restored ${cleaned.length} entries.`);
    };
    reader.onerror = () => alert("That file couldn't be read.");
    reader.readAsText(file);
  };

  const streak = streakLength(logs);

  return (
    <div style={{ maxWidth:480, margin:"0 auto", minHeight:"100vh", background:"#FAF7F2" }}>
      <header style={{ background:"linear-gradient(135deg,#1e3d2f 0%,#2C5F4A 100%)",
        padding:"22px 20px 18px", display:"flex", justifyContent:"space-between", alignItems:"flex-end", gap:12 }}>
        <div>
          <div style={{ fontFamily:"'Lora',serif", fontSize:26, fontWeight:800, color:"#fff",
            letterSpacing:.3, lineHeight:1 }}>PsA Journal</div>
          <div style={{ fontSize:12, color:"rgba(255,255,255,.65)", marginTop:4, letterSpacing:.4 }}>
            Psoriatic arthritis tracker
          </div>
        </div>
        <div style={{ textAlign:"right" }}>
          <div style={{ fontSize:13, color:"rgba(255,255,255,.85)" }}>
            {new Date().toLocaleDateString("en-GB",{ weekday:"short", day:"numeric", month:"short" })}
          </div>
          <div style={{ fontSize:11, color:"rgba(255,255,255,.5)", marginTop:2 }}>
            {logs.length} entr{logs.length === 1 ? "y" : "ies"}
          </div>
          {streak >= 2 && (
            <div style={{ fontSize:11, color:"#FFD8A8", marginTop:3, fontWeight:600 }}>
              {streak} days in a row
            </div>
          )}
        </div>
      </header>

      <nav style={{ display:"flex", background:"#fff", borderBottom:"1px solid #ECE5DC",
        position:"sticky", top:0, zIndex:100, boxShadow:"0 2px 8px rgba(0,0,0,.06)" }}>
        {[["log","Today"],["history","History"],["insights","Insights"]].map(([id,label]) => (
          <button key={id} onClick={() => setTab(id)} aria-current={tab === id ? "page" : undefined} style={{
            flex:1, padding:"13px 4px", border:"none",
            borderBottom:`2.5px solid ${tab === id ? "#2C5F4A" : "transparent"}`,
            background:"#fff", cursor:"pointer", fontSize:13.5,
            fontWeight: tab === id ? 600 : 400,
            color: tab === id ? "#2C5F4A" : "#9a9189", transition:"all .15s" }}>{label}</button>
        ))}
      </nav>

      <main style={{ padding:"16px 16px 0" }}>
        {!STORAGE_OK && (
          <div style={{ background:"#FFF3E0", border:"1.5px solid #FFB74D", borderRadius:12,
            padding:"12px 14px", marginBottom:14, fontSize:12.5, color:"#7a4a10", lineHeight:1.6 }}>
            <strong>Nothing can be saved in this window.</strong> Browser storage is blocked here, so
            entries will disappear on refresh. Save this file to the device and open it directly, or
            export a backup before closing.
          </div>
        )}
        {tab === "log" && (
          <LogTab log={log} setLog={setLog} onSave={onSave} saveMsg={saveMsg}
            onResetToToday={onResetToToday} logs={logs} prefs={prefs}/>
        )}
        {tab === "history" && (
          <HistoryTab logs={logs} onExport={onExport} onExportCsv={onExportCsv} onImport={onImport}
            onEditEntry={onEditEntry} onDeleteEntry={onDeleteEntry} onAddMissedDay={onAddMissedDay}
            onLoadDemo={onLoadDemo} onWipeAll={onWipeAll} prefs={prefs} updatePrefs={updatePrefs}/>
        )}
        {tab === "insights" && (
          <InsightsTab logs={logs} onEditEntry={onEditEntry} onAddMissedDay={onAddMissedDay} prefs={prefs}/>
        )}
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<PsATracker />);
</script>
</body>
</html>
