<script>

  window.__psaBootTimer = setTimeout(function () {

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo } = React;

// ─── Data ─────────────────────────────────────────────────────────────────────

const JOINTS = [
  { id:"fingers_l", label:"Left Fingers" }, { id:"fingers_r", label:"Right Fingers" },
  { id:"wrist_l",   label:"Left Wrist" },   { id:"wrist_r",   label:"Right Wrist" },
  { id:"elbow_l",   label:"Left Elbow" },   { id:"elbow_r",   label:"Right Elbow" },
  { id:"shoulder_l",label:"Left Shoulder"}, { id:"shoulder_r",label:"Right Shoulder"},
  { id:"hip_l",     label:"Left Hip" },     { id:"hip_r",     label:"Right Hip" },
  { id:"knee_l",    label:"Left Knee" },    { id:"knee_r",    label:"Right Knee" },
  { id:"ankle_l",   label:"Left Ankle" },   { id:"ankle_r",   label:"Right Ankle" },
  { id:"heel_l",    label:"Left Heel" },    { id:"heel_r",    label:"Right Heel" },
  { id:"toes_l",    label:"Left Toes" },    { id:"toes_r",    label:"Right Toes" },
  { id:"lower_back",label:"Lower Back" },   { id:"neck",      label:"Neck" },
];
const JOINT_LABEL = id => (JOINTS.find(j => j.id === id) || {}).label || id;

const TRIGGERS = [
  { id:"dairy",         label:"Dairy",          emoji:"🧀" },
  { id:"gluten",        label:"Gluten/Wheat",   emoji:"🍞" },
  { id:"refined-carbs", label:"Refined Carbs",  emoji:"🥖" },
  { id:"processed",     label:"Processed Food", emoji:"🌭" },
  { id:"fried",         label:"Fried Foods",    emoji:"🍳" },
  { id:"sugar",         label:"Sugar/Sweets",   emoji:"🍬" },
  { id:"nightshades",   label:"Nightshades",    emoji:"🍅" },
  { id:"red-meat",      label:"Red Meat",       emoji:"🥩" },
  { id:"eggs",          label:"Eggs",           emoji:"🥚" },
  { id:"coffee",        label:"Coffee",         emoji:"☕" },
];

const POSITIVES = [
  { id:"oily-fish",  label:"Oily Fish",       emoji:"🐟" },
  { id:"vegetables", label:"Fruits & Veg",    emoji:"🥦" },
  { id:"berries",    label:"Berries",         emoji:"🫐" },
  { id:"olive-oil",  label:"Olive Oil",       emoji:"🫒" },
  { id:"fermented",  label:"Fermented Foods", emoji:"🫙" },
  { id:"nuts",       label:"Nuts & Seeds",    emoji:"🥜" },
  { id:"turmeric",   label:"Turmeric",        emoji:"🌿" },
];

const ALL_FOODS = [...TRIGGERS, ...POSITIVES];
const EXERCISE_OPTS = ["Walking","Yoga / Stretching","Pilates","Swimming","Cycling","Strength Training","Running","Other"];
const WEATHER_OPTS  = ["☀️ Sunny","⛅ Cloudy","🌧️ Rainy","🌬️ Windy","❄️ Cold","💧 Humid","🌡️ Hot"];

const MORNING_LBLS = ["–","Fine","Stiff","Very Sore"];
const MORNING_BG   = ["#F0E8E0","#E8F5E9","#FFE0B2","#FFCDD2"];
const MORNING_FG   = ["#9a9189","#388E3C","#EF6C00","#B71C1C"];

const PAIN_BG   = ["#E8F5E9","#C8E6C9","#FFF9C4","#FFE0B2","#FFCCBC","#FFCDD2"];
const PAIN_FG   = ["#388E3C","#2E7D32","#F9A825","#EF6C00","#BF360C","#B71C1C"];
const PAIN_LBLS = ["None","Very Mild","Mild","Moderate","Severe","Very Severe"];
const FATIGUE_LBLS = ["None","Very Little","Mild","Moderate","Heavy","Exhausted"];
const STRESS_LBLS  = ["None","Very Low","Low","Moderate","High","Very High"];
const pb = v => PAIN_BG[v]   ?? PAIN_BG[0];
const pf = v => PAIN_FG[v]   ?? PAIN_FG[0];
const pl = v => PAIN_LBLS[v] ?? "";

// ─── Dates (all local time — never toISOString, which shifts the day) ─────────

const pad2 = n => String(n).padStart(2, "0");
const dateStrOf = d => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const todayStr  = () => dateStrOf(new Date());
const parseDate = s => new Date(s + "T12:00:00");
const addDaysStr = (s, n) => { const d = parseDate(s); d.setDate(d.getDate() + n); return dateStrOf(d); };
const daysBetween = (a, b) => Math.round((parseDate(b) - parseDate(a)) / 86400000);
const fmtLong  = s => parseDate(s).toLocaleDateString("en-GB", { weekday:"long", day:"numeric", month:"long" });
const fmtMed   = s => parseDate(s).toLocaleDateString("en-GB", { day:"numeric", month:"short", year:"numeric" });
const fmtShort = s => parseDate(s).toLocaleDateString("en-GB", { day:"numeric", month:"short" });

// ─── Entry schema ─────────────────────────────────────────────────────────────

const emptyLog = () => ({
  date:todayStr(), overallPain:0, joints:{}, swelling:{},
  foods:[], exercises:[], exerciseMinsByType:{},
  alcohol:0, stress:0, sleep:7, weather:[], notes:"",
  skinFlare:0,
  fatigue:0,
  morning:0,            // 0 = not answered, 1 Fine, 2 Stiff, 3 Very Sore
  periodStart:false,    // true = period began on this day
  onPeriod:false,       // true = bleeding today (any day of period, not just day 1)
});

// Exercises for an entry, handling both old (string) and new (array) schemas.
const getExercises = (entry) => {
  if (Array.isArray(entry.exercises)) return entry.exercises.filter(e => typeof e === "string");
  if (entry.exercise && entry.exercise !== "None") return [entry.exercise];
  return [];
};

// Minutes-by-exercise-type, handling all schema versions:
//   v1: { exercise: "Walking", exerciseMins: 30 }                  → { Walking: 30 }
//   v2: { exercises: ["Walking","Yoga"], exerciseMins: 45 }        → split evenly
//   v3: { exercises: [...], exerciseMinsByType: { Walking: 30 } }  → use as-is
const getExerciseMinsByType = (entry) => {
  if (entry.exerciseMinsByType && typeof entry.exerciseMinsByType === "object") {
    return { ...entry.exerciseMinsByType };
  }
  const list = getExercises(entry);
  const total = entry.exerciseMins || 0;
  if (list.length === 0 || total === 0) return {};
  const per = Math.round(total / list.length);
  const out = {};
  list.forEach(t => { out[t] = per; });
  return out;
};

const getTotalExerciseMins = (entry) =>
  Object.values(getExerciseMinsByType(entry)).reduce((s, v) => s + v, 0);

// Brings an entry of any vintage up to the current shape. Every path that loads
// an entry (storage, form, import, edit) goes through here, so migration lives
// in exactly one place.
function hydrate(entry) {
  const merged = { ...emptyLog(), ...entry };
  merged.exercises = getExercises(entry);
  merged.exerciseMinsByType = getExerciseMinsByType(entry);
  delete merged.exercise;      // legacy v1
  delete merged.exerciseMins;  // legacy v1/v2
  return merged;
}

const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
// Checked component by component: browsers happily roll "2026-02-30" over into
// March rather than rejecting it, which would silently file an entry on the
// wrong day.
const isValidDateStr = (s) => {
  if (typeof s !== "string" || !DATE_RE.test(s)) return false;
  const [y, m, d] = s.split("-").map(Number);
  if (m < 1 || m > 12 || d < 1 || d > 31) return false;
  const dt = new Date(y, m - 1, d);
  return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d;
};

// Anything arriving from storage or a backup file is untrusted: one bad entry
// used to be enough to break the whole Insights tab.
function sanitiseEntry(raw) {
  if (!raw || typeof raw !== "object" || !isValidDateStr(raw.date)) return null;
  const e = hydrate(raw);
  const num = (v, lo, hi, dflt) => {
    const n = Number(v);
    return Number.isFinite(n) ? Math.min(hi, Math.max(lo, n)) : dflt;
  };
  const strList = v => (Array.isArray(v) ? v.filter(x => typeof x === "string") : []);
  const scoreMap = v => {
    const out = {};
    if (v && typeof v === "object") Object.entries(v).forEach(([k, s]) => {
      const n = Math.round(num(s, 0, 5, 0));
      if (n > 0) out[k] = n;
    });
    return out;
  };
  const boolMap = v => {
    const out = {};
    if (v && typeof v === "object") Object.entries(v).forEach(([k, s]) => { if (s) out[k] = true; });
    return out;
  };
  const mins = {};
  Object.entries(e.exerciseMinsByType).forEach(([k, m]) => { mins[k] = Math.round(num(m, 0, 1440, 0)); });

  return {
    ...e,
    overallPain: Math.round(num(e.overallPain, 0, 5, 0)),
    fatigue:     Math.round(num(e.fatigue,     0, 5, 0)),
    skinFlare:   Math.round(num(e.skinFlare,   0, 5, 0)),
    stress:      Math.round(num(e.stress,      0, 5, 0)),
    morning:     Math.round(num(e.morning,     0, 3, 0)),
    sleep:       num(e.sleep, 0, 24, 7),
    alcohol:     Math.round(num(e.alcohol, 0, 99, 0)),
    joints:      scoreMap(e.joints),
    swelling:    boolMap(e.swelling),
    foods:       strList(e.foods),
    weather:     strList(e.weather),
    exercises:   strList(e.exercises),
    exerciseMinsByType: mins,
    notes:       typeof e.notes === "string" ? e.notes.slice(0, 4000) : "",
    onPeriod:    !!e.onPeriod,
    periodStart: !!e.periodStart && !!e.onPeriod,
  };
}

// Clean, de-duplicate (last entry for a date wins) and sort.
function sanitiseLogs(arr) {
  if (!Array.isArray(arr)) return [];
  const byDate = {};
  arr.forEach(raw => { const e = sanitiseEntry(raw); if (e) byDate[e.date] = e; });
  return Object.values(byDate).sort((a, b) => a.date.localeCompare(b.date));
}

// Order-independent serialisation, used for "are there unsaved changes?".
function stable(v) {
  if (Array.isArray(v)) return "[" + v.map(stable).join(",") + "]";
  if (v && typeof v === "object") {
    return "{" + Object.keys(v).sort().map(k => JSON.stringify(k) + ":" + stable(v[k])).join(",") + "}";
  }
  return JSON.stringify(v === undefined ? null : v);
}

// ─── Statistics core ──────────────────────────────────────────────────────────
// Everything below is pure: no React, no DOM, no storage. Both the Insights tab
// and the doctor's PDF read from these functions, so the two can't drift apart.

const MIN_GROUP  = 4;    // minimum days either side of a comparison
const MIN_EFFECT = 0.3;  // smaller differences are treated as noise

const mean = arr => (arr.length ? arr.reduce((s, x) => s + x, 0) / arr.length : null);
const median = arr => {
  if (!arr.length) return null;
  const s = [...arr].sort((a, b) => a - b);
  const m = Math.floor(s.length / 2);
  return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2;
};

// Difference between two group means, with a 95% confidence interval (Welch).
// `reliable` is the gate for showing a pattern as a finding rather than a hint:
// the interval has to clear zero AND the effect has to be big enough to matter.
function diffStats(groupA, groupB, minN = MIN_GROUP) {
  const n1 = groupA.length, n2 = groupB.length;
  if (n1 < minN || n2 < minN) return null;
  const m1 = mean(groupA), m2 = mean(groupB);
  const varOf = (arr, m) => (arr.length < 2 ? 0 : arr.reduce((s, x) => s + (x - m) ** 2, 0) / (arr.length - 1));
  const se = Math.sqrt(varOf(groupA, m1) / n1 + varOf(groupB, m2) / n2);
  const diff = m1 - m2;
  const margin = 1.96 * se;
  return {
    diff: +diff.toFixed(2),
    lo: +(diff - margin).toFixed(2),
    hi: +(diff + margin).toFixed(2),
    se: +se.toFixed(3),
    m1: +m1.toFixed(2), m2: +m2.toFixed(2), n1, n2,
    reliable: Math.abs(diff) >= MIN_EFFECT && Math.abs(diff) > margin,
  };
}

const signed = v => `${v > 0 ? "+" : ""}${v.toFixed(1)}`;
const ciText = st => `95% CI ${signed(st.lo)} to ${signed(st.hi)}`;
const lagLabel = lag => (lag === 0 ? "same day" : lag === 1 ? "next day" : `${lag} days later`);

// Triggers in PsA often land a day or two later, so each candidate is tested at
// several lags. Where more than one lag looks real, the largest effect wins;
// where none do, the largest is still returned but flagged unreliable.
function lagInsight(logs, predicate, lags = [0, 1, 2]) {
  const byDate = {};
  logs.forEach(l => { byDate[l.date] = l; });
  const results = lags.map(lag => {
    const yes = [], no = [];
    logs.forEach(l => {
      const target = byDate[addDaysStr(l.date, lag)];
      if (!target) return;                       // day not logged — can't compare
      (predicate(l) ? yes : no).push(target.overallPain || 0);
    });
    const st = diffStats(yes, no);
    return st ? { lag, ...st } : null;
  }).filter(Boolean);
  if (!results.length) return null;
  const reliable = results.filter(r => r.reliable);
  const pool = reliable.length ? reliable : results;
  const best = pool.reduce((b, r) => (Math.abs(r.diff) > Math.abs(b.diff) ? r : b));
  return { ...best, lagsTested: results.length };
}

function foodLagInsights(logs) {
  return ALL_FOODS
    .map(food => {
      const best = lagInsight(logs, l => (l.foods || []).includes(food.id));
      return best ? { ...food, ...best } : null;
    })
    .filter(Boolean)
    .sort((a, b) => (b.reliable - a.reliable) || (Math.abs(b.diff) - Math.abs(a.diff)));
}

function weatherInsights(logs) {
  return WEATHER_OPTS
    .map(w => {
      const on  = logs.filter(l => (l.weather || []).includes(w)).map(l => l.overallPain || 0);
      const off = logs.filter(l => !(l.weather || []).includes(w)).map(l => l.overallPain || 0);
      const st = diffStats(on, off);
      return st ? { label: w, ...st } : null;
    })
    .filter(Boolean)
    .sort((a, b) => (b.reliable - a.reliable) || (Math.abs(b.diff) - Math.abs(a.diff)));
}

// Pain burden per joint: total pain across the period divided by every logged
// day, so unaffected days count as zero and a chronic ache outranks one bad day.
function jointBurdens(logs, minDays = 2) {
  if (!logs.length) return [];
  const scores = {}, swollen = {};
  logs.forEach(l => {
    Object.entries(l.joints || {}).forEach(([id, p]) => {
      if (p > 0) (scores[id] = scores[id] || []).push(p);
    });
    Object.entries(l.swelling || {}).forEach(([id, s]) => { if (s) swollen[id] = (swollen[id] || 0) + 1; });
  });
  return JOINTS
    .map(j => {
      const list = scores[j.id] || [];
      if (list.length < minDays) return null;
      const total = list.reduce((s, x) => s + x, 0);
      return {
        ...j,
        days: list.length,
        burden: +(total / logs.length).toFixed(2),
        avgWhenPainful: +(total / list.length).toFixed(1),
        freqPct: Math.round((list.length / logs.length) * 100),
        swelling: swollen[j.id] || 0,
      };
    })
    .filter(Boolean)
    .sort((a, b) => b.burden - a.burden);
}

// Runs of consecutive days at or above `threshold`. Gaps in logging break a run
// rather than being silently bridged.
function flareEpisodes(logs, { threshold = 3, minRun = 3 } = {}) {
  const sorted = [...logs].sort((a, b) => a.date.localeCompare(b.date));
  const out = [];
  let run = [];
  const flush = () => {
    if (run.length >= minRun) {
      out.push({
        start: run[0].date,
        end: run[run.length-1].date,
        days: run.length,
        peak: Math.max(...run.map(d => d.overallPain || 0)),
        avg: +mean(run.map(d => d.overallPain || 0)).toFixed(1),
      });
    }
    run = [];
  };
  sorted.forEach(l => {
    const isFlare = (l.overallPain || 0) >= threshold;
    const contiguous = run.length && daysBetween(run[run.length-1].date, l.date) === 1;
    if (isFlare && contiguous) run.push(l);
    else { flush(); if (isFlare) run = [l]; }
  });
  flush();
  return out;
}

// Least-squares trend over real elapsed days, so a gap in logging doesn't
// stretch or squash the slope.
function trendLine(logs, key = "overallPain") {
  const sorted = [...logs].sort((a, b) => a.date.localeCompare(b.date));
  if (sorted.length < 4) return null;
  const base = sorted[0].date;
  const xs = sorted.map(l => daysBetween(base, l.date));
  const ys = sorted.map(l => l[key] || 0);
  const mx = mean(xs), my = mean(ys);
  let num = 0, den = 0;
  for (let i = 0; i < xs.length; i++) { num += (xs[i]-mx) * (ys[i]-my); den += (xs[i]-mx) ** 2; }
  const slope = den === 0 ? 0 : num / den;
  const intercept = my - slope * mx;
  const span = xs[xs.length-1];
  const startVal = intercept, endVal = intercept + slope * span;
  const change = +(endVal - startVal).toFixed(2);
  return {
    slope, intercept, span, startVal, endVal, change,
    direction: Math.abs(change) < MIN_EFFECT ? "stable" : change < 0 ? "improving" : "worsening",
  };
}

// Splits a date-sorted list wherever more than `maxGap` days are missing, so a
// chart can break the line instead of drawing through days that were never logged.
function segmentByGaps(sorted, maxGap = 2) {
  if (!sorted.length) return [];
  const segs = [[sorted[0]]];
  for (let i = 1; i < sorted.length; i++) {
    if (daysBetween(sorted[i-1].date, sorted[i].date) > maxGap) segs.push([sorted[i]]);
    else segs[segs.length-1].push(sorted[i]);
  }
  return segs;
}

// Consecutive days logged, counting back from today (or yesterday, if today
// isn't filled in yet — no penalty before the day is over).
function streakLength(logs) {
  const seen = new Set(logs.map(l => l.date));
  let cursor = todayStr();
  if (!seen.has(cursor)) cursor = addDaysStr(cursor, -1);
  let streak = 0;
  while (seen.has(cursor)) { streak++; cursor = addDaysStr(cursor, -1); }
  return streak;
}

// Cycle phase per entry, derived from "day 1" markers.
//   menstruation — flagged as bleeding
//   pms          — the 5 days before the next period starts
//   midcycle     — everything else
// Days after the most recent day 1 have no marker ahead of them to anchor PMS,
// so the next start is projected from the median observed cycle length. Without
// that projection the newest three or four weeks of data were being discarded.
function buildCyclePhases(logs) {
  const sorted = [...logs].sort((a, b) => a.date.localeCompare(b.date));
  const starts = sorted.filter(l => l.periodStart).map(l => l.date);
  if (!starts.length) return null;

  const gaps = [];
  for (let i = 1; i < starts.length; i++) gaps.push(daysBetween(starts[i-1], starts[i]));
  const plausible = gaps.filter(g => g >= 18 && g <= 45);
  const cycleLen = plausible.length ? Math.round(median(plausible)) : null;
  const lastStart = starts[starts.length-1];

  let projectionUsed = false;
  const phaseOf = (l) => {
    if (l.onPeriod) return "menstruation";
    let next = starts.find(d => d > l.date);
    if (!next && cycleLen) {
      next = addDaysStr(lastStart, cycleLen);
      let guard = 0;
      while (next <= l.date && guard++ < 40) next = addDaysStr(next, cycleLen);
      if (next <= l.date) return null;
      projectionUsed = true;
    }
    if (!next) return null;
    const gap = daysBetween(l.date, next);
    return gap >= 1 && gap <= 5 ? "pms" : "midcycle";
  };

  const buckets = { menstruation: [], pms: [], midcycle: [] };
  sorted.forEach(l => {
    const ph = phaseOf(l);
    if (ph) buckets[ph].push(l.overallPain || 0);
  });

  const summarise = arr => (arr.length >= 3 ? { avg: mean(arr), n: arr.length, values: arr } : null);
  const out = {
    menstruation: summarise(buckets.menstruation),
    pms: summarise(buckets.pms),
    midcycle: summarise(buckets.midcycle),
    cyclesTracked: starts.length,
    cycleLen,
    projectionUsed,
  };
  if (!out.midcycle || (!out.menstruation && !out.pms)) return null;
  out.pmsVsMid  = out.pms  ? diffStats(buckets.pms, buckets.midcycle) : null;
  out.periodVsMid = out.menstruation ? diffStats(buckets.menstruation, buckets.midcycle) : null;
  return out;
}

// The lifestyle factors, all scored the same way and all carrying their own
// confidence interval. The PDF prints `text`; the Insights tab draws from `st`.
function factorPatterns(logs) {
  const out = [];
  const add = (key, label, st, phrase) => { if (st) out.push({ key, label, st, text: phrase(st) }); };
  const dir = st => (st.diff > 0 ? "higher" : "lower");
  const mag = st => Math.abs(st.diff).toFixed(1);

  add("exercise", "Exercise",
    diffStats(
      logs.filter(l => getExercises(l).length > 0).map(l => l.overallPain || 0),
      logs.filter(l => getExercises(l).length === 0).map(l => l.overallPain || 0)),
    st => `Exercise: pain averages ${mag(st)} points ${dir(st)} on activity days (${st.n1} active vs ${st.n2} rest days; ${ciText(st)}).`);

  const alcLag = lagInsight(logs, l => (l.alcohol || 0) > 0);
  if (alcLag) out.push({ key:"alcohol", label:"Alcohol", st:alcLag,
    text: `Alcohol: pain averages ${mag(alcLag)} points ${dir(alcLag)} ${lagLabel(alcLag.lag)} after drinking (${alcLag.n1} vs ${alcLag.n2} days; ${ciText(alcLag)}).` });

  add("sleep", "Sleep",
    diffStats(
      logs.filter(l => l.sleep < 6).map(l => l.overallPain || 0),
      logs.filter(l => l.sleep >= 7).map(l => l.overallPain || 0)),
    st => `Sleep: pain averages ${mag(st)} points ${dir(st)} after nights under 6 hours than after 7 hours or more (${st.n1} vs ${st.n2} nights; ${ciText(st)}).`);

  add("stress", "Stress",
    diffStats(
      logs.filter(l => (l.stress || 0) >= 4).map(l => l.overallPain || 0),
      logs.filter(l => (l.stress || 0) > 0 && (l.stress || 0) <= 2).map(l => l.overallPain || 0)),
    st => `Stress: pain averages ${mag(st)} points ${dir(st)} on high-stress days than on low-stress days (${st.n1} vs ${st.n2} days; ${ciText(st)}).`);

  add("skin", "Skin and joints",
    diffStats(
      logs.filter(l => (l.skinFlare || 0) >= 2).map(l => l.overallPain || 0),
      logs.filter(l => (l.skinFlare || 0) < 2).map(l => l.overallPain || 0)),
    st => `Skin and joints: joint pain averages ${mag(st)} points ${dir(st)} on days the skin is also flaring (${st.n1} vs ${st.n2} days; ${ciText(st)}).`);

  const cycle = buildCyclePhases(logs);
  if (cycle && cycle.pmsVsMid) out.push({ key:"pms", label:"PMS phase", st:cycle.pmsVsMid,
    text: `PMS phase (5 days before a period): pain averages ${mag(cycle.pmsVsMid)} points ${dir(cycle.pmsVsMid)} than mid-cycle (${cycle.pmsVsMid.n1} vs ${cycle.pmsVsMid.n2} days; ${ciText(cycle.pmsVsMid)}).` });
  if (cycle && cycle.periodVsMid) out.push({ key:"period", label:"Menstruation", st:cycle.periodVsMid,
    text: `Menstruation: pain averages ${mag(cycle.periodVsMid)} points ${dir(cycle.periodVsMid)} than mid-cycle (${cycle.periodVsMid.n1} vs ${cycle.periodVsMid.n2} days; ${ciText(cycle.periodVsMid)}).` });

  return out;
}

// Per-exercise-type comparison: this type vs every other day (rest or a
// different activity). Only types with enough days on both sides appear.
function exerciseTypeInsights(logs) {
  const types = new Set();
  logs.forEach(l => getExercises(l).forEach(t => types.add(t)));
  return Array.from(types)
    .map(type => {
      const st = diffStats(
        logs.filter(l => getExercises(l).includes(type)).map(l => l.overallPain || 0),
        logs.filter(l => !getExercises(l).includes(type)).map(l => l.overallPain || 0));
      return st ? { type, ...st } : null;
    })
    .filter(Boolean)
    .filter(r => Math.abs(r.diff) >= MIN_EFFECT)
    .sort((a, b) => (b.reliable - a.reliable) || (Math.abs(b.diff) - Math.abs(a.diff)));
}

// Morning stiffness is only meaningful where it was actually answered — the
// unanswered default of 0 used to be averaged in as "better than Fine".
const morningAnswered = logs => logs.filter(l => l.morning >= 1 && l.morning <= 3);
const stiffPct = (logs) => {
  const answered = morningAnswered(logs);
  if (!answered.length) return null;
  return (answered.filter(l => l.morning >= 2).length / answered.length) * 100;
};

// ─── Storage: localStorage, with an in-memory fallback ────────────────────────

const SKEY = "psa-tracker-v1";
const PKEY = "psa-tracker-prefs-v1";
const DEFAULT_PREFS = { trackCycle: true };
let _cache = [];
let _prefsCache = { ...DEFAULT_PREFS };

// Probed once. When this is false (private-browsing quirks, some embedded
// viewers) the app still runs, but nothing survives a refresh — so it says so
// rather than quietly losing a week of logging.
const STORAGE_OK = (() => {
  try {
    localStorage.setItem("__psa_probe", "1");
    localStorage.removeItem("__psa_probe");
    return true;
  } catch (_) { return false; }
})();

function readLogs() {
  try {
    const raw = localStorage.getItem(SKEY);
    if (raw) _cache = sanitiseLogs(JSON.parse(raw));
  } catch (_) {}
  return _cache;
}

function writeLogs(logs) {
  _cache = logs;
  try { localStorage.setItem(SKEY, JSON.stringify(logs)); return true; }
  catch (_) { return false; }
}

function readPrefs() {
  try {
    const raw = localStorage.getItem(PKEY);
    if (raw) _prefsCache = { ..._prefsCache, ...JSON.parse(raw) };
  } catch (_) {}
  return _prefsCache;
}

function writePrefs(prefs) {
  _prefsCache = { ..._prefsCache, ...prefs };
  try { localStorage.setItem(PKEY, JSON.stringify(_prefsCache)); return true; }
  catch (_) { return false; }
}

// ─── Demo data generator ─────────────────────────────────────────────────────
// 60 days of synthetic but plausible data, with patterns the insights engine
// should be able to find:
//   - Dairy raises pain ~1.0 points 2 days later   (lag analysis)
//   - Alcohol raises pain ~0.7 points the next day (lag analysis)
//   - Sleep under 6h raises pain ~0.5 points       (sleep comparison)
//   - Exercise lowers pain ~0.4 points same day    (exercise comparison)
//   - Skin and joint flares loosely co-occur       (skin-joint link)
//   - Right knee, left fingers and lower back are the chronic joints
//   - A 28-day cycle with PMS days ~0.7 points worse (cycle insight)
//   - Roughly one day in twelve is missed entirely, so gaps get exercised too

function generateDemoData() {
  const days = 60;
  const rand = () => Math.random();
  const clamp = (v, lo = 0, hi = 5) => Math.max(lo, Math.min(hi, v));
  const today = todayStr();

  const base = [];
  for (let i = days - 1; i >= 0; i--) {
    const dateStr = addDaysStr(today, -i);
    const dayIndex = days - 1 - i;              // 0 = oldest, 59 = today

    let basePain = 1.5 + rand() * 0.8;
    if (dayIndex >= 5  && dayIndex <= 9)  basePain += 1.8;   // early flare cluster
    if (dayIndex >= 18 && dayIndex <= 21) basePain += 1.5;   // second flare cluster
    if (dayIndex >= 45) basePain -= 0.4;                     // gradually improving

    const ateDairy = rand() < 0.45;
    const dayOfWeek = parseDate(dateStr).getDay();
    const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
    const alcohol = isWeekend && rand() < 0.6 ? 1 + Math.floor(rand() * 3) : (rand() < 0.15 ? 1 : 0);

    const roll = rand();
    const exercise = roll < 0.5  ? null
      : roll < 0.65 ? "Walking"
      : roll < 0.78 ? "Yoga / Stretching"
      : roll < 0.88 ? "Pilates"
      : roll < 0.95 ? "Swimming" : "Cycling";
    const exerciseMins = exercise ? 15 + Math.floor(rand() * 4) * 15 : 0;
    const sleep = Math.round((6.5 + (rand() - 0.5) * 3.5) * 2) / 2;   // 4.75–8.25 in 0.5 steps

    const foods = [];
    const maybe = (p, id) => { if (rand() < p) foods.push(id); };
    if (ateDairy) foods.push("dairy");
    maybe(0.50, "gluten");  maybe(0.30, "processed"); maybe(0.20, "fried");
    maybe(0.40, "sugar");   maybe(0.20, "red-meat");  maybe(0.15, "eggs");
    maybe(0.25, "oily-fish"); maybe(0.70, "vegetables"); maybe(0.50, "olive-oil");
    maybe(0.30, "berries"); maybe(0.20, "nuts");      maybe(0.10, "turmeric");
    maybe(0.15, "fermented");

    base.push({ date: dateStr, basePain, foods, ateDairy, alcohol, sleep, exercise, exerciseMins });
  }

  // A 28-day cycle: 4 bleeding days, PMS the 5 days before day 1.
  const anchor = Math.floor(rand() * 28);
  const periodStarts = new Set(), onPeriod = new Set(), pms = new Set();
  for (let c = 0; ; c++) {
    const startIdx = anchor + c * 28 + (c > 0 ? Math.floor(rand() * 3) - 1 : 0);
    if (startIdx >= days) break;
    if (startIdx >= 0) periodStarts.add(startIdx);
    for (let d = 0; d < 4; d++) if (startIdx + d >= 0 && startIdx + d < days) onPeriod.add(startIdx + d);
    for (let d = 1; d <= 5; d++) if (startIdx - d >= 0) pms.add(startIdx - d);
  }

  const entries = base.map((e, i) => {
    let pain = e.basePain;
    if (i >= 1) {
      if (base[i-1].alcohol > 0) pain += 0.7 + rand() * 0.4;
      if (base[i-1].sleep < 6)   pain += 0.5 + rand() * 0.3;
    }
    if (i >= 2 && base[i-2].ateDairy) pain += 0.9 + rand() * 0.4;
    if (e.exercise) pain -= 0.4 + rand() * 0.2;
    if (pms.has(i))      pain += 0.6 + rand() * 0.3;
    if (onPeriod.has(i)) pain += 0.2 + rand() * 0.2;
    pain += (rand() - 0.5) * 0.6;
    const overallPain = clamp(Math.round(pain));

    const joints = {}, swelling = {};
    ["knee_r", "fingers_l", "lower_back"].forEach(jid => {
      const jp = clamp(Math.round(overallPain - 0.3 + (rand() - 0.5) * 1.5));
      if (jp > 0) joints[jid] = jp;
      if (jp >= 3 && rand() < 0.4) swelling[jid] = true;
    });
    if (overallPain >= 3) {
      ["wrist_r", "fingers_r", "ankle_l", "neck"].forEach(jid => {
        if (rand() < 0.5) {
          const jp = clamp(Math.round(overallPain - 1 + (rand() - 0.5) * 1.2));
          if (jp > 0) joints[jid] = jp;
        }
      });
    }

    const morning = overallPain >= 4 ? (rand() < 0.7 ? 3 : 2)
                  : overallPain >= 2 ? (rand() < 0.6 ? 2 : 1)
                  : (rand() < 0.7 ? 1 : 2);
    const fatigue = clamp(Math.round(overallPain - 0.3 + (rand() - 0.5) * 1.4));

    let skinBase = 1.2 + (i / days) * 0.5;
    if (overallPain >= 3 && rand() < 0.6) skinBase += 1;
    if (i >= 10 && i <= 14) skinBase += 1.5;           // dedicated skin flare
    const skinFlare = clamp(Math.round(skinBase + (rand() - 0.5) * 1.2));
    const stress = clamp(Math.round(2 + (overallPain - 2) * 0.4 + (rand() - 0.5) * 1.5));

    const weather = [WEATHER_OPTS[Math.floor(rand() * WEATHER_OPTS.length)]];
    if (rand() < 0.3) weather.push(WEATHER_OPTS[Math.floor(rand() * WEATHER_OPTS.length)]);

    let notes = "";
    if (overallPain >= 4 && rand() < 0.5) {
      notes = ["Tough day. Difficult getting out of bed.","Struggled to grip a mug at breakfast.",
        "Cancelled plans, needed to rest.","Worse than usual — could barely walk by evening.",
        "Took extra anti-inflammatories."][Math.floor(rand() * 5)];
    } else if (overallPain <= 1 && rand() < 0.3) {
      notes = ["Good day overall, felt almost normal.","Energy much better today.",
        "Joints felt looser than usual."][Math.floor(rand() * 3)];
    }

    return {
      date: e.date, overallPain, joints, swelling, foods: e.foods,
      exercises: e.exercise ? [e.exercise] : [],
      exerciseMinsByType: e.exercise ? { [e.exercise]: e.exerciseMins } : {},
      alcohol: e.alcohol, stress, sleep: e.sleep, weather, notes,
      skinFlare, fatigue, morning,
      onPeriod: onPeriod.has(i),
      periodStart: periodStarts.has(i),
    };
  });

  // Drop the odd day so the calendar, streak and chart gaps look like real life.
  return entries.filter((e, i) => i === entries.length - 1 || Math.random() > 0.08);
}

// ─── Pain trend chart ─────────────────────────────────────────────────────────
// Plotted against real dates rather than entry order, and the line breaks over
// gaps, so a fortnight of missed logging can't masquerade as a smooth stretch.

function PainTrendChart({ logs }) {
  const [range, setRange] = useState("1M");
  const RANGES = [
    { id:"1M",  label:"1M",  days:30 },
    { id:"3M",  label:"3M",  days:90 },
    { id:"6M",  label:"6M",  days:180 },
    { id:"ALL", label:"All", days:Infinity },
  ];
  const days = RANGES.find(r => r.id === range).days;
  const cutoff = Number.isFinite(days) ? addDaysStr(todayStr(), -(days - 1)) : "0000-01-01";
  const filtered = logs.filter(l => l.date >= cutoff).sort((a,b) => a.date.localeCompare(b.date));

  if (filtered.length < 2) {
    return (
      <div>
        <RangeToggle range={range} setRange={setRange} ranges={RANGES}/>
        <div style={{ padding:"40px 0", textAlign:"center", color:"#9a9189", fontSize:13 }}>
          {filtered.length === 1
            ? "One entry in this period — two or more are needed to draw a line."
            : "Nothing logged in this period yet."}
        </div>
      </div>
    );
  }

  const avg = arr => arr.reduce((s,x) => s+x, 0) / arr.length;
  // Named windowSize rather than window, which would shadow the global.
  const windowSize = Math.max(3, Math.ceil(filtered.length / 7));
  const startAvg = avg(filtered.slice(0, windowSize).map(l => l.overallPain));
  const endAvg   = avg(filtered.slice(-windowSize).map(l => l.overallPain));

  // The regression is the honest measure of direction; the window averages are
  // the fallback when there are too few points to fit a line.
  const tl = trendLine(filtered);
  const change = tl ? tl.change : +(endAvg - startAvg).toFixed(2);
  const isImproving = change < -MIN_EFFECT;
  const isWorsening = change >  MIN_EFFECT;
  const trendColor = isImproving ? "#2C5F4A" : isWorsening ? "#C62828" : "#9a9189";
  const arrow = isImproving ? "▼" : isWorsening ? "▲" : "→";
  const pctChange = startAvg >= 1 ? (change / startAvg) * 100 : null;

  const w = 340, h = 180, padL = 26, padR = 8, padT = 12, padB = 28;
  const first = filtered[0].date, last = filtered[filtered.length-1].date;
  const span = Math.max(daysBetween(first, last), 1);
  const xOf = dateStr => padL + (daysBetween(first, dateStr) / span) * (w - padL - padR);
  const yOf = v => h - padB - (v / 5) * (h - padT - padB);

  const segments = segmentByGaps(filtered);
  // Days that could have been logged in this window: the range itself, or the
  // life of the diary if that's shorter. Counting only the span between the first
  // and last entry would flatter a patchy month.
  const earliest = logs.reduce((m, l) => (l.date < m ? l.date : m), logs[0].date);
  const windowStart = Number.isFinite(days) ? (cutoff > earliest ? cutoff : earliest) : earliest;
  const daysInRange = Math.max(daysBetween(windowStart, todayStr()) + 1, filtered.length);

  // De-duplicated: over a two- or three-day range the evenly spaced positions can
  // land on the same date, which would repeat a React key and stack the labels.
  const tickCount = filtered.length > 60 ? 5 : filtered.length > 14 ? 4 : 3;
  const ticks = [...new Set(
    Array.from({ length: tickCount }, (_, i) => addDaysStr(first, Math.round((span * i) / (tickCount - 1))))
  )];

  return (
    <div>
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-end", marginBottom:14 }}>
        <div>
          <div style={{ fontFamily:"'Lora',serif", fontSize:32, fontWeight:800, color:"#1e3d2f", lineHeight:1 }}>
            {endAvg.toFixed(1)}<span style={{ fontSize:14, fontWeight:400, color:"#9a9189", marginLeft:4 }}>/5</span>
          </div>
          <div style={{ fontSize:11, color:"#9a9189", marginTop:4 }}>
            Recent average · {filtered.length} of {daysInRange} days logged
          </div>
        </div>
        <div style={{ textAlign:"right" }}>
          <div style={{ fontFamily:"'Lora',serif", fontSize:18, fontWeight:700, color:trendColor, lineHeight:1 }}>
            {arrow} {signed(change)} pts
          </div>
          <div style={{ fontSize:11, color:trendColor, marginTop:4, fontWeight:600 }}>
            {pctChange === null ? "across this period"
              : `${Math.abs(pctChange) < 1 ? "<1" : Math.abs(pctChange).toFixed(0)}% across this period`}
          </div>
        </div>
      </div>

      <RangeToggle range={range} setRange={setRange} ranges={RANGES}/>

      <svg viewBox={`0 0 ${w} ${h}`} role="img"
        aria-label={`Pain trend, ${filtered.length} days logged, changing by ${change.toFixed(1)} points across the period`}
        style={{ width:"100%", height:180, overflow:"visible", marginTop:12 }}>
        <defs>
          <linearGradient id="painArea" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stopColor={trendColor} stopOpacity="0.18"/>
            <stop offset="100%" stopColor={trendColor} stopOpacity="0"/>
          </linearGradient>
        </defs>

        {[0,1,2,3,4,5].map(v => (
          <g key={v}>
            <line x1={padL} y1={yOf(v)} x2={w-padR} y2={yOf(v)} stroke="#F0E8E0" strokeDasharray="3 3"/>
            <text x={padL-4} y={yOf(v)+3} fontSize="9" fill="#9a9189" textAnchor="end">{v}</text>
          </g>
        ))}

        {segments.map((seg, si) => {
          const pts = seg.map(d => `${xOf(d.date)},${yOf(d.overallPain)}`).join(" ");
          return (
            <g key={si}>
              {seg.length > 1 && (
                <polygon fill="url(#painArea)"
                  points={`${xOf(seg[0].date)},${yOf(0)} ${pts} ${xOf(seg[seg.length-1].date)},${yOf(0)}`}/>
              )}
              {seg.length > 1
                ? <polyline points={pts} fill="none" stroke={trendColor} strokeWidth="2"
                    strokeLinecap="round" strokeLinejoin="round"/>
                : <circle cx={xOf(seg[0].date)} cy={yOf(seg[0].overallPain)} r="2.5" fill={trendColor}/>}
            </g>
          );
        })}

        {tl && (
          <line x1={xOf(first)} y1={yOf(Math.max(0, Math.min(5, tl.startVal)))}
                x2={xOf(last)}  y2={yOf(Math.max(0, Math.min(5, tl.endVal)))}
                stroke={trendColor} strokeWidth="1" strokeDasharray="4 3" opacity="0.55"/>
        )}

        {filtered.length <= 35 && filtered.map(d => (
          <circle key={d.date} cx={xOf(d.date)} cy={yOf(d.overallPain)} r="2" fill={trendColor}/>
        ))}
        <circle cx={xOf(first)} cy={yOf(filtered[0].overallPain)} r="3.5"
          fill="#fff" stroke={trendColor} strokeWidth="2"/>
        <circle cx={xOf(last)} cy={yOf(filtered[filtered.length-1].overallPain)} r="3.5"
          fill={trendColor} stroke="#fff" strokeWidth="1.5"/>

        {ticks.map((t, i) => (
          <text key={t} x={xOf(t)} y={h-10} fontSize="9" fill="#9a9189"
            textAnchor={i === 0 ? "start" : i === ticks.length-1 ? "end" : "middle"}>
            {fmtShort(t)}
          </text>
        ))}
      </svg>

      <div style={{ fontSize:11, color:"#9a9189", textAlign:"center", marginTop:6, fontStyle:"italic" }}>
        {tl
          ? `Dashed line is the fitted trend, ${tl.startVal.toFixed(1)} → ${tl.endVal.toFixed(1)}.`
          : `Comparing the first and last few days, ${startAvg.toFixed(1)} → ${endAvg.toFixed(1)}.`}
        {segments.length > 1 ? " The line breaks where days weren't logged." : ""}
      </div>
    </div>
  );
}

// ─── Calendar heatmap ─────────────────────────────────────────────────────────

function CalendarHeatmap({ logs, onEditEntry, onAddMissedDay }) {
  const today = parseDate(todayStr());
  const [viewDate, setViewDate] = useState(new Date(today.getFullYear(), today.getMonth(), 1));
  const [metric, setMetric] = useState("overallPain");

  const METRICS = [
    { key:"overallPain", label:"Pain",    accent:"#C62828" },
    { key:"fatigue",     label:"Fatigue", accent:"#6A4C93" },
    { key:"skinFlare",   label:"Skin",    accent:"#B85C38" },
  ];
  const metricLabel = (METRICS.find(m => m.key === metric) || {}).label;

  const byDate = {};
  logs.forEach(l => { byDate[l.date] = l; });

  const year  = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const monthLabel = viewDate.toLocaleDateString("en-GB", { month:"long", year:"numeric" });
  const firstDay = new Date(year, month, 1);
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const firstCol = (firstDay.getDay() + 6) % 7;      // Monday-first
  const ymPrefix = `${year}-${pad2(month+1)}-`;
  const todayKey = todayStr();

  const isCurrentMonth = year === today.getFullYear() && month === today.getMonth();

  const cells = [];
  for (let i = 0; i < firstCol; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) {
    const key = ymPrefix + pad2(d);
    const entry = byDate[key];
    cells.push({
      d, key, entry,
      isFuture: key > todayKey,
      isToday: key === todayKey,
      value: entry ? (entry[metric] || 0) : null,
    });
  }

  const handleTap = (cell) => {
    if (cell.isFuture) return;
    if (cell.entry) onEditEntry(cell.key);
    else onAddMissedDay(cell.key);
  };

  const cellBg = c => (c.isFuture ? "#FAF7F2" : c.value === null ? "#F5F0EB" : PAIN_BG[c.value]);
  const cellFg = c => (c.isFuture ? "#D6CFC5" : c.value === null ? "#C9BBAB" : PAIN_FG[c.value]);

  return (
    <div>
      <div style={{ display:"flex", gap:6, marginBottom:14 }}>
        {METRICS.map(m => (
          <button key={m.key} onClick={() => setMetric(m.key)} aria-pressed={metric===m.key} style={{
            flex:1, padding:"8px 0", borderRadius:8,
            border:`1.5px solid ${metric===m.key ? m.accent : "#E2D9CE"}`,
            background: metric===m.key ? m.accent : "#fff",
            color: metric===m.key ? "#fff" : "#7a7069",
            cursor:"pointer", fontSize:12, fontWeight:600,
          }}>{m.label}</button>
        ))}
      </div>

      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:12 }}>
        <button onClick={() => setViewDate(new Date(year, month-1, 1))} aria-label="Previous month" style={{
          padding:"6px 14px", borderRadius:8, border:"1px solid #E2D9CE",
          background:"#fff", cursor:"pointer", fontSize:14, color:"#2C5F4A", fontWeight:600 }}>‹</button>
        <div style={{ fontFamily:"'Lora',serif", fontWeight:700, fontSize:15, color:"#1e3d2f" }}>{monthLabel}</div>
        <button onClick={() => setViewDate(new Date(year, month+1, 1))} disabled={isCurrentMonth}
          aria-label="Next month" style={{
          padding:"6px 14px", borderRadius:8,
          border:`1px solid ${isCurrentMonth ? "#F0E8E0" : "#E2D9CE"}`,
          background:"#fff", cursor: isCurrentMonth ? "not-allowed" : "pointer",
          fontSize:14, color: isCurrentMonth ? "#D6CFC5" : "#2C5F4A", fontWeight:600 }}>›</button>
      </div>

      <div style={{ display:"grid", gridTemplateColumns:"repeat(7, 1fr)", gap:4, marginBottom:4 }}>
        {["M","T","W","T","F","S","S"].map((h,i) => (
          <div key={i} style={{ textAlign:"center", fontSize:10, color:"#9a9189", fontWeight:600 }}>{h}</div>
        ))}
      </div>

      <div style={{ display:"grid", gridTemplateColumns:"repeat(7, 1fr)", gap:4 }}>
        {cells.map((c,i) => c ? (
          <button key={i} onClick={() => handleTap(c)} disabled={c.isFuture}
            title={c.isFuture ? "" : c.entry ? `${fmtShort(c.key)} — ${metricLabel} ${c.value}/5` : `${fmtShort(c.key)} — not logged`}
            aria-label={c.isFuture ? `${fmtShort(c.key)}, future date`
              : c.entry ? `${fmtShort(c.key)}, ${metricLabel} ${c.value} out of 5, tap to edit`
              : `${fmtShort(c.key)}, not logged, tap to add`}
            style={{
              aspectRatio:"1/1", border:c.isToday ? "2px solid #2C5F4A" : "1px solid transparent",
              borderRadius:7, background:cellBg(c), color:cellFg(c),
              cursor: c.isFuture ? "not-allowed" : "pointer",
              fontSize:13, fontWeight: c.entry ? 700 : 500, fontFamily:"'DM Sans',sans-serif",
              display:"flex", alignItems:"center", justifyContent:"center", padding:0,
            }}>{c.d}</button>
        ) : <div key={i}/>)}
      </div>

      <div style={{ marginTop:14, display:"flex", alignItems:"center", gap:8, justifyContent:"center", flexWrap:"wrap" }}>
        <span style={{ fontSize:10, color:"#9a9189" }}>None</span>
        {[0,1,2,3,4,5].map(v => (
          <div key={v} style={{ width:18, height:14, background:PAIN_BG[v],
            borderRadius:3, border:`1px solid ${PAIN_FG[v]}30` }}/>
        ))}
        <span style={{ fontSize:10, color:"#9a9189" }}>Severe</span>
        <div style={{ width:18, height:14, background:"#F5F0EB",
          borderRadius:3, border:"1px solid #C9BBAB", marginLeft:8 }}/>
        <span style={{ fontSize:10, color:"#9a9189" }}>Not logged</span>
      </div>

      <div style={{ fontSize:11, color:"#9a9189", textAlign:"center", marginTop:10, fontStyle:"italic" }}>
        Tap a day to fill it in or edit it · today is outlined
      </div>
    </div>
  );
}

// ─── Doctor's report (PDF) ────────────────────────────────────────────────────
// Reads from the same statistics core as the Insights tab, so what she shows the
// rheumatologist and what she sees in the app can't disagree.

function generateDoctorReport(allLogs, { startDate, endDate, patientName }) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:"mm", format:"a4" });

  const PAGE_W = 210, PAGE_H = 297, MARGIN = 15;
  const CONTENT_W = PAGE_W - MARGIN * 2;

  const logs = allLogs
    .filter(l => l.date >= startDate && l.date <= endDate)
    .sort((a,b) => a.date.localeCompare(b.date));

  const avg = arr => (arr.length ? arr.reduce((s,x)=>s+x,0)/arr.length : null);
  const fmtNum = v => (v === null || v === undefined ? "—" : v.toFixed(1));

  const PAIN_RGB    = [[232,245,233],[200,230,201],[255,249,196],[255,224,178],[255,204,188],[255,205,210]];
  const PAIN_RGB_FG = [[56,142,60],[46,125,50],[249,168,37],[239,108,0],[191,54,12],[183,28,28]];

  let y = MARGIN;
  const addPageHeader = () => {
    doc.setFont("helvetica","normal").setFontSize(8).setTextColor(150,150,150);
    doc.text(`PsA Journal | ${fmtMed(startDate)} - ${fmtMed(endDate)}`, MARGIN, 10);
    doc.text(`Page ${doc.internal.getNumberOfPages()}`, PAGE_W - MARGIN, 10, { align:"right" });
  };
  const newPageIfNeeded = (needed) => {
    if (y + needed > PAGE_H - MARGIN) { doc.addPage(); y = MARGIN; addPageHeader(); }
  };
  const rule = () => { doc.setDrawColor(236,229,220).setLineWidth(0.3).line(MARGIN, y, PAGE_W-MARGIN, y); y += 6; };
  const heading = (text) => {
    doc.setFont("helvetica","bold").setFontSize(13).setTextColor(30,61,47);
    doc.text(text, MARGIN, y); y += 7;
  };
  const paragraph = (text, size = 10, colour = [50,50,50]) => {
    doc.setFont("helvetica","normal").setFontSize(size).setTextColor(...colour);
    const lines = doc.splitTextToSize(text, CONTENT_W);
    lines.forEach(line => { newPageIfNeeded(6); doc.text(line, MARGIN, y); y += size * 0.45 + 1.6; });
  };
  const footnote = (text) => {
    newPageIfNeeded(8);
    doc.setFont("helvetica","italic").setFontSize(7).setTextColor(120,120,120);
    doc.splitTextToSize(text, CONTENT_W).forEach(line => { doc.text(line, MARGIN, y); y += 3.4; });
    y += 2;
  };

  addPageHeader();
  y = MARGIN + 5;

  doc.setFont("helvetica","bold").setFontSize(20).setTextColor(30,61,47);
  doc.text("PsA Symptom Report", MARGIN, y);
  y += 8;
  doc.setFont("helvetica","normal").setFontSize(11).setTextColor(122,112,105);
  doc.text(`${fmtMed(startDate)} to ${fmtMed(endDate)}`, MARGIN, y);
  y += 6;
  if (patientName) {
    doc.setFontSize(10);
    doc.text(`Patient: ${patientName}`, MARGIN, y);
    y += 6;
  }
  const periodDays = daysBetween(startDate, endDate) + 1;
  doc.setFontSize(9).setTextColor(154,145,137);
  doc.text(`${logs.length} of ${periodDays} days logged | Generated ${fmtMed(todayStr())}`, MARGIN, y);
  y += 10;

  if (logs.length === 0) {
    doc.setFont("helvetica","normal").setFontSize(12).setTextColor(120,120,120);
    doc.text("No entries in this date range.", MARGIN, y);
    return doc;
  }

  // ─── Figures, computed once and reused ─────────────────────────────────────
  const avgPain    = avg(logs.map(l => l.overallPain || 0));
  const avgFatigue = avg(logs.map(l => l.fatigue || 0));
  const avgSkin    = avg(logs.map(l => l.skinFlare || 0));
  const avgSleep   = avg(logs.map(l => l.sleep || 0));
  const flareDays  = logs.filter(l => (l.overallPain || 0) >= 3).length;
  const flareRate  = Math.round((flareDays / logs.length) * 100);
  const coverage   = Math.round((logs.length / periodDays) * 100);
  const exDays     = logs.filter(l => getExercises(l).length > 0).length;
  const totalUnits = logs.reduce((s,l) => s + (l.alcohol || 0), 0);
  const unitsPerWk = totalUnits / (logs.length / 7);

  const morningCounts = [0,0,0,0];
  logs.forEach(l => { if (l.morning >= 1 && l.morning <= 3) morningCounts[l.morning]++; });
  const morningLogged = morningCounts[1] + morningCounts[2] + morningCounts[3];
  const stiffOrWorse = stiffPct(logs);

  const topJoints = jointBurdens(logs).slice(0, 8);
  const patterns  = factorPatterns(logs);
  const reliable  = patterns.filter(p => p.st.reliable);
  const unclear   = patterns.filter(p => !p.st.reliable);
  const tl        = trendLine(logs);
  const flares    = flareEpisodes(logs);

  // ─── Summary in plain language ─────────────────────────────────────────────
  rule();
  heading("Summary");

  const painLevel = avgPain < 1.5 ? "low" : avgPain < 2.5 ? "mild to moderate" : avgPain < 3.5 ? "moderate" : "high";
  const summaryLines = [
    `Average pain across this period was ${avgPain.toFixed(1)}/5 (${painLevel}), with ${flareDays} flare day${flareDays===1?"":"s"} (pain at 3 or above), or ${flareRate}% of the days logged.`,
  ];
  if (tl) {
    summaryLines.push(
      tl.direction === "stable"
        ? "Overall pain was broadly stable across the period, with no clear trend in either direction."
        : `Overall pain was ${tl.direction} across the period, with the fitted trend moving ${tl.direction === "improving" ? "down" : "up"} by ${Math.abs(tl.change).toFixed(1)} points from start to end.`);
  }
  if (stiffOrWorse !== null && morningLogged >= 5) {
    summaryLines.push(`Morning stiffness was reported as stiff or very sore on ${Math.round(stiffOrWorse)}% of the ${morningLogged} mornings answered.`);
  }
  if (topJoints.length) {
    summaryLines.push(`The joints carrying the most pain were ${topJoints.slice(0,3).map(j => j.label).join(", ")}.`);
  }
  if (avgSkin >= 1.5) {
    const d = avgSkin < 2.5 ? "mild to moderate" : avgSkin < 3.5 ? "moderate" : avgSkin < 4.5 ? "moderate to severe" : "severe";
    summaryLines.push(`Psoriasis severity averaged ${avgSkin.toFixed(1)}/5 (${d}).`);
  }
  if (avgFatigue >= 2.5) {
    summaryLines.push(`Fatigue was a consistent feature, averaging ${avgFatigue.toFixed(1)}/5.`);
  }
  if (coverage < 80) {
    summaryLines.push(`Days were logged on ${coverage}% of this period, so the figures describe the days recorded rather than every day.`);
  }
  summaryLines.forEach(line => paragraph(line));
  y += 3;

  // ─── Headline numbers ──────────────────────────────────────────────────────
  newPageIfNeeded(70);
  rule();
  heading("The numbers");

  const drawStat = (col, top, label, value, sub) => {
    const colW = (CONTENT_W - 6) / 4;
    const x = MARGIN + col * (colW + 2);
    doc.setFillColor(248,243,237).rect(x, top, colW, 26, "F");
    doc.setFont("helvetica","bold").setFontSize(17).setTextColor(30,61,47);
    doc.text(value, x + colW/2, top + 10, { align:"center" });
    doc.setFont("helvetica","normal").setFontSize(8).setTextColor(80,80,80);
    doc.text(doc.splitTextToSize(label, colW - 4), x + colW/2, top + 15, { align:"center" });
    if (sub) {
      doc.setFontSize(7).setTextColor(150,150,150);
      doc.text(sub, x + colW/2, top + 22, { align:"center" });
    }
  };
  drawStat(0, y, "Avg pain (/5)",    fmtNum(avgPain),    null);
  drawStat(1, y, "Flare days",       `${flareDays}`,     `${flareRate}% of logged`);
  drawStat(2, y, "Avg fatigue (/5)", fmtNum(avgFatigue), null);
  drawStat(3, y, "Avg skin (/5)",    fmtNum(avgSkin),    null);
  y += 29;
  drawStat(0, y, "Days logged",      `${logs.length}`,   `${coverage}% of period`);
  drawStat(1, y, "Active days",      `${exDays}`,        `${Math.round((exDays/logs.length)*100)}% of logged`);
  drawStat(2, y, "Avg sleep (h)",    fmtNum(avgSleep),   null);
  drawStat(3, y, "Alcohol (units)",  unitsPerWk.toFixed(1), "per week");
  y += 29;
  footnote("Flare days are days where overall pain was rated 3 (moderate) or higher. Averages cover the days logged, not the whole period.");

  // ─── Morning stiffness ─────────────────────────────────────────────────────
  if (morningLogged > 0) {
    newPageIfNeeded(30);
    doc.setFont("helvetica","bold").setFontSize(11).setTextColor(30,61,47);
    doc.text("Morning stiffness", MARGIN, y);
    y += 6;
    const labels = ["Fine","Stiff","Very sore"];
    const colours = [[200,230,201],[255,224,178],[255,205,210]];
    let xPos = MARGIN;
    [1,2,3].forEach(v => {
      const pct = morningCounts[v] / morningLogged;
      const segW = pct * CONTENT_W;
      if (segW > 0) {
        doc.setFillColor(...colours[v-1]).rect(xPos, y, segW, 6, "F");
        if (segW > 18) {
          doc.setFont("helvetica","bold").setFontSize(8).setTextColor(40,40,40);
          doc.text(`${Math.round(pct*100)}%`, xPos + segW/2, y+4, { align:"center" });
        }
        xPos += segW;
      }
    });
    y += 9;
    doc.setFont("helvetica","normal").setFontSize(8).setTextColor(120,120,120);
    [1,2,3].forEach((v,i) => {
      const cx = MARGIN + i * (CONTENT_W/3);
      doc.setFillColor(...colours[v-1]).rect(cx, y, 3, 3, "F");
      doc.text(`${labels[i]}: ${morningCounts[v]} day${morningCounts[v]===1?"":"s"}`, cx+5, y+2.5);
    });
    y += 9;
  }

  // ─── Joints ────────────────────────────────────────────────────────────────
  newPageIfNeeded(60);
  rule();
  heading("Most affected joints");

  if (!topJoints.length) {
    paragraph("No joint was painful on more than one day in this period.", 10, [150,150,150]);
  } else {
    const COL_BAR_X = 55, COL_BAR_W = 32, COL_BURDEN = 91, COL_DAYS = 118, COL_AVG = 145, COL_SWOLLEN = 168;
    doc.setFont("helvetica","bold").setFontSize(8).setTextColor(120,120,120);
    doc.text("JOINT", MARGIN, y);
    doc.text("PAIN BURDEN", MARGIN + COL_BAR_X, y);
    doc.text("DAYS", MARGIN + COL_DAYS, y);
    doc.text("AVG", MARGIN + COL_AVG, y);
    doc.text("SWOLLEN", MARGIN + COL_SWOLLEN, y);
    y += 4;
    doc.setDrawColor(236,229,220).setLineWidth(0.3).line(MARGIN, y, PAGE_W-MARGIN, y);
    y += 5;

    const maxBurden = Math.max(...topJoints.map(j => j.burden), 0.01);
    topJoints.forEach(j => {
      newPageIfNeeded(8);
      doc.setFont("helvetica","normal").setFontSize(10).setTextColor(30,61,47);
      doc.text(j.label, MARGIN, y);

      const colourIdx = Math.min(5, Math.round(j.avgWhenPainful));
      doc.setFillColor(240,232,224).rect(MARGIN + COL_BAR_X, y-3, COL_BAR_W, 4, "F");
      doc.setFillColor(...PAIN_RGB_FG[colourIdx])
        .rect(MARGIN + COL_BAR_X, y-3, (j.burden / maxBurden) * COL_BAR_W, 4, "F");

      doc.setFont("helvetica","bold").setFontSize(10).setTextColor(...PAIN_RGB_FG[colourIdx]);
      doc.text(j.burden.toFixed(2), MARGIN + COL_BURDEN, y);
      doc.setFont("helvetica","normal").setFontSize(9).setTextColor(80,80,80);
      doc.text(`${j.days}/${logs.length}`, MARGIN + COL_DAYS, y);
      doc.text(j.avgWhenPainful.toFixed(1), MARGIN + COL_AVG, y);
      if (j.swelling > 0) doc.setTextColor(59,130,246); else doc.setTextColor(120,120,120);
      doc.text(j.swelling > 0 ? `${j.swelling}d` : "-", MARGIN + COL_SWOLLEN, y);
      y += 6;
    });
    y += 1;
    footnote("Pain burden is total pain divided by every day logged, so days the joint was fine count as zero. It combines how often and how badly a joint hurt; the list is sorted by it. Joints painful on only one day are omitted.");
  }

  // ─── Patterns ──────────────────────────────────────────────────────────────
  newPageIfNeeded(50);
  rule();
  heading("Patterns worth discussing");

  if (!reliable.length) {
    paragraph("No factor separated clearly from day-to-day variation in this period. With more days logged, differences of around half a point become detectable.", 10, [110,110,110]);
  } else {
    reliable.forEach(p => {
      newPageIfNeeded(14);
      paragraph("- " + p.text);
    });
  }
  if (unclear.length) {
    y += 1;
    footnote(`Also checked, without a clear signal either way: ${unclear.map(p => p.label.toLowerCase()).join(", ")}. Confidence intervals are unadjusted for the number of comparisons made, so treat any single finding as a lead to test rather than a conclusion.`);
  }

  // ─── Pain over time ────────────────────────────────────────────────────────
  newPageIfNeeded(85);
  rule();
  heading("Pain over time");

  const chartH = 55, chartX = MARGIN, chartW = CONTENT_W;
  const chartY = y;
  doc.setFillColor(252,250,247).rect(chartX, chartY, chartW, chartH, "F");
  doc.setDrawColor(240,232,224).setLineWidth(0.2);
  for (let v = 0; v <= 5; v++) {
    const gy = chartY + chartH - (v/5) * chartH;
    doc.line(chartX, gy, chartX + chartW, gy);
    doc.setFont("helvetica","normal").setFontSize(7).setTextColor(150,150,150);
    doc.text(`${v}`, chartX - 3, gy + 1, { align:"right" });
  }

  if (logs.length > 1) {
    const firstD = logs[0].date, lastD = logs[logs.length-1].date;
    const span = Math.max(daysBetween(firstD, lastD), 1);
    const xOf = ds => chartX + (daysBetween(firstD, ds) / span) * chartW;
    const yOf = v => chartY + chartH - (Math.max(0, Math.min(5, v)) / 5) * chartH;

    doc.setDrawColor(122,142,132).setLineWidth(0.4);
    segmentByGaps(logs).forEach(seg => {
      for (let i = 1; i < seg.length; i++) {
        doc.line(xOf(seg[i-1].date), yOf(seg[i-1].overallPain), xOf(seg[i].date), yOf(seg[i].overallPain));
      }
    });
    doc.setFillColor(122,142,132);
    logs.forEach(l => doc.circle(xOf(l.date), yOf(l.overallPain), 0.6, "F"));

    let trendColour = [122,112,105], trendLabel = "Trend: not enough data to fit";
    if (tl) {
      trendColour = tl.direction === "improving" ? [44,95,74] : tl.direction === "worsening" ? [198,40,40] : [122,112,105];
      trendLabel = tl.direction === "stable"
        ? `Trend: stable (${signed(tl.change)} points across the period)`
        : `Trend: ${tl.direction} (${tl.direction === "improving" ? "down" : "up"} ${Math.abs(tl.change).toFixed(1)} points across the period)`;
      doc.setDrawColor(...trendColour).setLineWidth(1.0);
      doc.setLineDashPattern([2.5, 1.5], 0);
      doc.line(xOf(firstD), yOf(tl.startVal), xOf(lastD), yOf(tl.endVal));
      doc.setLineDashPattern([], 0);
      doc.setFillColor(...trendColour);
      doc.circle(xOf(firstD), yOf(tl.startVal), 1.5, "F");
      doc.circle(xOf(lastD),  yOf(tl.endVal),   1.5, "F");
    }

    doc.setFont("helvetica","normal").setFontSize(7).setTextColor(150,150,150);
    doc.text(fmtShort(firstD), chartX, chartY + chartH + 5);
    doc.text(fmtShort(addDaysStr(firstD, Math.round(span/2))), chartX + chartW/2, chartY + chartH + 5, { align:"center" });
    doc.text(fmtShort(lastD), chartX + chartW, chartY + chartH + 5, { align:"right" });

    y = chartY + chartH + 10;
    doc.setFont("helvetica","bold").setFontSize(9).setTextColor(...trendColour);
    doc.text(trendLabel, MARGIN, y);
    y += 4;
    footnote("Light line is daily pain, plotted against the calendar so gaps in logging show as gaps. Bold dashed line is a least-squares trend.");
  } else {
    y = chartY + chartH + 10;
  }

  // ─── Calendar ──────────────────────────────────────────────────────────────
  newPageIfNeeded(55);
  heading("Daily pain calendar");
  doc.setFont("helvetica","normal").setFontSize(8).setTextColor(120,120,120);
  doc.text("Each cell is that day's overall pain. Empty cells were not logged.", MARGIN, y);
  y += 6;

  const months = Array.from(new Set(logs.map(l => l.date.slice(0,7)))).sort();
  const byDate = {};
  logs.forEach(l => { byDate[l.date] = l; });

  const calsPerRow = 3, calGap = 6;
  const calW = (CONTENT_W - calGap * (calsPerRow-1)) / calsPerRow;
  const cellSize = calW / 7;
  const calH = cellSize * 6 + 8;

  months.forEach((ym, idx) => {
    const col = idx % calsPerRow;
    if (col === 0) newPageIfNeeded(calH + 4);
    const cx = MARGIN + col * (calW + calGap);
    const cy = y;
    const [yy, mm] = ym.split("-").map(Number);
    const monthDate = new Date(yy, mm-1, 1);

    doc.setFont("helvetica","bold").setFontSize(8).setTextColor(30,61,47);
    doc.text(monthDate.toLocaleDateString("en-GB", { month:"short", year:"numeric" }), cx, cy);

    const headY = cy + 2;
    doc.setFont("helvetica","normal").setFontSize(5.5).setTextColor(150,150,150);
    ["M","T","W","T","F","S","S"].forEach((d,i) => {
      doc.text(d, cx + i*cellSize + cellSize/2, headY + 3, { align:"center" });
    });

    const firstWeekday = (monthDate.getDay() + 6) % 7;
    const daysInMonth = new Date(yy, mm, 0).getDate();
    const gridY = headY + 4;
    for (let d = 1; d <= daysInMonth; d++) {
      const dayIndex = firstWeekday + d - 1;
      const cellX = cx + (dayIndex % 7) * cellSize;
      const cellY = gridY + Math.floor(dayIndex / 7) * cellSize;
      const entry = byDate[`${ym}-${pad2(d)}`];
      if (entry) {
        const p = entry.overallPain || 0;
        doc.setFillColor(...PAIN_RGB[p]).rect(cellX+0.2, cellY+0.2, cellSize-0.4, cellSize-0.4, "F");
        doc.setFont("helvetica","bold").setFontSize(5.5).setTextColor(...PAIN_RGB_FG[p]);
      } else {
        doc.setFillColor(245,240,235).rect(cellX+0.2, cellY+0.2, cellSize-0.4, cellSize-0.4, "F");
        doc.setFont("helvetica","normal").setFontSize(5.5).setTextColor(200,190,180);
      }
      doc.text(`${d}`, cellX + cellSize/2, cellY + cellSize/2 + 1, { align:"center" });
    }
    if (col === calsPerRow-1 || idx === months.length-1) y += calH + 3;
  });

  // ─── Flare episodes ────────────────────────────────────────────────────────
  newPageIfNeeded(40);
  rule();
  heading("Flare episodes");
  doc.setFont("helvetica","normal").setFontSize(8).setTextColor(120,120,120);
  doc.text("Runs of three or more consecutive logged days at pain 3 or higher.", MARGIN, y);
  y += 7;

  if (!flares.length) {
    paragraph("No episode met that description in this period.", 10, [150,150,150]);
  } else {
    flares.forEach(f => {
      newPageIfNeeded(8);
      doc.setFillColor(...PAIN_RGB[f.peak]).rect(MARGIN, y-3, 3, 5, "F");
      doc.setFont("helvetica","normal").setFontSize(10).setTextColor(50,50,50);
      doc.text(`${fmtMed(f.start)} - ${fmtMed(f.end)}`, MARGIN + 5, y);
      doc.setFont("helvetica","bold").setTextColor(...PAIN_RGB_FG[f.peak]);
      doc.text(`${f.days} days | avg ${f.avg.toFixed(1)} | peak ${f.peak}/5`, PAGE_W - MARGIN, y, { align:"right" });
      y += 6;
    });
  }

  // ─── Daily entries ─────────────────────────────────────────────────────────
  newPageIfNeeded(50);
  y += 3;
  rule();
  heading("Daily entries");

  const NOTES_X = MARGIN + 132;
  const NOTES_W = PAGE_W - MARGIN - NOTES_X;
  const tableHeader = () => {
    doc.setFont("helvetica","bold").setFontSize(8).setTextColor(120,120,120);
    doc.text("DATE", MARGIN, y);
    doc.text("PAIN", MARGIN+38, y);
    doc.text("MORN", MARGIN+52, y);
    doc.text("FATG", MARGIN+66, y);
    doc.text("SKIN", MARGIN+80, y);
    doc.text("SLP",  MARGIN+94, y);
    doc.text("EX",   MARGIN+106, y);
    doc.text("ALC",  MARGIN+118, y);
    doc.text("NOTES", NOTES_X, y);
    y += 3;
    doc.setDrawColor(220,210,200).setLineWidth(0.3).line(MARGIN, y, PAGE_W-MARGIN, y);
    y += 3.5;
  };
  tableHeader();

  logs.forEach(l => {
    if (y + 7 > PAGE_H - MARGIN) { doc.addPage(); y = MARGIN; addPageHeader(); y += 4; tableHeader(); }
    const p = l.overallPain || 0;
    doc.setFont("helvetica","normal").setFontSize(8).setTextColor(50,50,50);
    doc.text(fmtShort(l.date), MARGIN, y);
    doc.setFillColor(...PAIN_RGB[p]).rect(MARGIN+38, y-2.5, 4, 3.5, "F");
    doc.setTextColor(...PAIN_RGB_FG[p]);
    doc.text(`${p}`, MARGIN+43.5, y);
    doc.setTextColor(50,50,50);
    doc.text(l.morning ? ["","F","S","V"][l.morning] : "-", MARGIN+52, y);
    doc.text(`${l.fatigue || 0}`,   MARGIN+66, y);
    doc.text(`${l.skinFlare || 0}`, MARGIN+80, y);
    doc.text(`${l.sleep || 0}h`,    MARGIN+94, y);
    doc.text(getExercises(l).length ? "Y" : "-", MARGIN+106, y);
    doc.text(`${l.alcohol || 0}`,   MARGIN+118, y);
    if (l.notes) {
      const noteLines = doc.splitTextToSize(l.notes, NOTES_W);
      doc.setTextColor(100,100,100);
      doc.text(noteLines[0] + (noteLines.length > 1 ? "..." : ""), NOTES_X, y);
    }
    y += 5;
  });

  newPageIfNeeded(18);
  y += 4;
  doc.setDrawColor(236,229,220).setLineWidth(0.3).line(MARGIN, y, PAGE_W-MARGIN, y);
  y += 5;
  footnote("Morning stiffness: F fine, S stiff, V very sore, - not answered. Pain, fatigue and skin are scored 0-5. EX marks a day with any exercise; ALC is alcohol units.");
  footnote("Generated by PsA Journal from self-reported daily entries. The patterns shown are statistical associations within one person's data and are not a clinical interpretation.");

  return doc;
}

// ─── Log tab ──────────────────────────────────────────────────────────────────

function JointGrid({ joints, log, setLog, openJoint, setOpenJoint }) {
  return (
    <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8 }}>
      {joints.map(j => {
        const pain    = log.joints[j.id] || 0;
        const swollen = !!(log.swelling || {})[j.id];
        const open    = openJoint === j.id;
        return (
          <div key={j.id} style={{ borderRadius:10, overflow:"hidden",
            border:`1.5px solid ${pain > 0 ? pf(pain)+"50" : "#E2D9CE"}`, background:pb(pain) }}>
            <button onClick={() => setOpenJoint(open ? null : j.id)} aria-expanded={open}
              style={{ width:"100%", background:"none", border:"none", cursor:"pointer",
                padding:"9px 12px", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
              <span style={{ fontSize:12, fontWeight:600, color:"#1e3d2f", textAlign:"left" }}>{j.label}</span>
              <div style={{ display:"flex", alignItems:"center", gap:5 }}>
                {swollen && <span style={{ fontSize:9, background:"#3B82F6", color:"#fff", borderRadius:4, padding:"1px 5px" }}>swollen</span>}
                {pain > 0 && <span style={{ fontSize:12, fontWeight:800, color:pf(pain) }}>{pain}</span>}
                <span style={{ fontSize:11, color:"#9a9189" }} aria-hidden="true">{open ? "▲" : "▼"}</span>
              </div>
            </button>
            {open && (
              <div style={{ padding:"0 12px 12px", borderTop:"1px solid #E2D9CE" }}>
                <div style={{ display:"flex", justifyContent:"space-between", paddingTop:10, marginBottom:8 }}>
                  {[0,1,2,3,4,5].map(v => (
                    <button key={v} aria-pressed={pain===v} aria-label={`${j.label} pain ${v}`}
                      onClick={() => setLog(p => ({ ...p, joints:{ ...p.joints, [j.id]:v } }))}
                      style={{ width:34, height:34, borderRadius:8,
                        border:`2px solid ${pain===v ? pf(v) : "transparent"}`,
                        background:pb(v), cursor:"pointer", fontWeight:800, fontSize:13, color:pf(v) }}>{v}</button>
                  ))}
                </div>
                <button aria-pressed={swollen}
                  onClick={() => setLog(p => ({ ...p, swelling:{ ...p.swelling, [j.id]: !(p.swelling || {})[j.id] } }))}
                  style={{ width:"100%", padding:"6px 0", borderRadius:7, border:"1.5px solid #3B82F6",
                    background: swollen ? "#3B82F6" : "#fff", color: swollen ? "#fff" : "#3B82F6",
                    cursor:"pointer", fontSize:12, fontWeight:500 }}>
                  💧 {swollen ? "Swollen — tap to remove" : "Mark as swollen"}
                </button>
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

function LogTab({ log, setLog, onSave, saveMsg, onResetToToday, logs, prefs }) {
  const [openJoint, setOpenJoint] = useState(null);
  const [showAllJoints, setShowAllJoints] = useState(false);

  const isPast = log.date !== todayStr();
  const savedEntry = logs.find(l => l.date === log.date);
  const isNewEntry = !savedEntry;
  const dirty = isNewEntry || stable(hydrate(savedEntry)) !== stable(log);
  const isBlank = isNewEntry && stable(log) === stable({ ...emptyLog(), date: log.date });

  const prevEntry = useMemo(
    () => logs.filter(l => l.date < log.date).sort((a,b) => b.date.localeCompare(a.date))[0],
    [logs, log.date]);

  // The joints she actually logs surface first; the full list stays one tap away.
  // Built from saved history only, so nothing shuffles under her thumb mid-edit.
  const pinnedIds = useMemo(() => {
    const counts = {};
    logs.forEach(l => Object.entries(l.joints || {}).forEach(([id, v]) => {
      if (v > 0) counts[id] = (counts[id] || 0) + 1;
    }));
    const frequent = Object.entries(counts)
      .filter(([, c]) => c >= 2)
      .sort((a,b) => b[1] - a[1])
      .slice(0, 8)
      .map(([id]) => id);
    const alreadySet = savedEntry
      ? Object.entries(savedEntry.joints || {}).filter(([, v]) => v > 0).map(([id]) => id) : [];
    return new Set([...frequent, ...alreadySet]);
  }, [logs, log.date]);

  const pinnedJoints = JOINTS.filter(j => pinnedIds.has(j.id));
  const otherJoints  = JOINTS.filter(j => !pinnedIds.has(j.id));
  const showEverything = showAllJoints || pinnedJoints.length === 0;

  const toggle = (field, id) => setLog(p => {
    const arr = p[field] || [];
    return { ...p, [field]: arr.includes(id) ? arr.filter(x => x !== id) : [...arr, id] };
  });

  // Notes and the cycle markers are deliberately not carried over: a note belongs
  // to its own day, and a copied "on my period" flag would quietly feed a wrong
  // day into the cycle figures.
  const copyPrevious = () => {
    setLog({ ...hydrate(prevEntry), date: log.date, notes:"", onPeriod:false, periodStart:false });
    setOpenJoint(null);
  };

  return (
    <div>
      {isPast && (
        <div style={{ background:"#FFF3E0", border:"1.5px solid #FFB74D", borderRadius:12,
          padding:"12px 14px", marginBottom:14, display:"flex", alignItems:"center",
          justifyContent:"space-between", gap:10 }}>
          <div>
            <div style={{ fontFamily:"'Lora',serif", fontWeight:700, fontSize:14, color:"#E65100" }}>
              {isNewEntry ? "Filling in a missed day" : "Editing a past entry"}
            </div>
            <div style={{ fontSize:12, color:"#7a7069", marginTop:2 }}>{fmtLong(log.date)}</div>
          </div>
          <button onClick={onResetToToday} style={{

            background:"#fff", color:"#E65100", cursor:"pointer",
            fontSize:12, fontWeight:600, whiteSpace:"nowrap" }}>← Today</button>
        </div>
      )}

      {isBlank && prevEntry && (
        <div style={{ background:"#fff", border:"1.5px dashed #2C5F4A", borderRadius:12,
          padding:"14px 16px", marginBottom:14 }}>
          <div style={{ fontSize:13, color:"#1e3d2f", marginBottom:4, lineHeight:1.5 }}>
            Most days look a lot like the last one. Start from {fmtLong(prevEntry.date)} and change what's different?
          </div>
          <div style={{ fontSize:11, color:"#9a9189", marginBottom:10 }}>
            Copies everything except the notes and the cycle markers.
          </div>
          <button onClick={copyPrevious} style={{
            width:"100%", padding:"10px 0", borderRadius:9, border:"1.5px solid #2C5F4A",
            background:"#fff", color:"#2C5F4A", cursor:"pointer", fontSize:13, fontWeight:600 }}>
            Copy that entry
          </button>
        </div>
      )}

      <Card title={isPast ? "Overall pain that day" : "Overall pain today"} emoji="🌡️">
        <div style={{ textAlign:"center", marginBottom:18 }}>
          <div style={{ fontSize:52, fontWeight:800, fontFamily:"'Lora',serif",
            color:pf(log.overallPain), lineHeight:1 }}>{log.overallPain}</div>
          <div style={{ fontSize:14, color:"#9a9189", marginTop:4 }}>{pl(log.overallPain)}</div>
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:10 }}>
          <span style={{ fontSize:11, color:"#9a9189" }}>None</span>

            onChange={e => setLog(p => ({ ...p, overallPain:+e.target.value }))} style={{ flex:1 }}/>
          <span style={{ fontSize:11, color:"#9a9189" }}>Severe</span>

      <Card title="How sore was the morning?" emoji="🌅">

          aria-label="Notes for this day"
          placeholder="Anything else? New medication, a stressful week, travel, how the day went overall…"
          style={{ width:"100%", minHeight:80, border:"1.5px solid #E2D9CE", borderRadius:10,
            padding:12, fontFamily:"inherit", fontSize:13, color:"#1e3d2f",
            background:"#FAF7F2", resize:"vertical", outline:"none", lineHeight:1.6 }}/>
      </Card>

      {/* Saving shouldn't need a scroll to the bottom of a long form. */}
      <div style={{ position:"sticky", bottom:0, zIndex:60, paddingTop:12, paddingBottom:20,
        background:"linear-gradient(to top,#FAF7F2 62%,rgba(250,247,242,0))" }}>
        <button onClick={onSave} style={{
          width:"100%", padding:"15px 0",
          background: saveMsg ? "#388E3C" : "#2C5F4A",
          color:"#fff", border:"none", borderRadius:13, fontSize:16,
          fontFamily:"'Lora',serif", fontWeight:700, cursor:"pointer",
          letterSpacing:.5, boxShadow:"0 4px 16px rgba(44,95,74,.35)", transition:"background .3s" }}>
          {saveMsg || (isPast ? (isNewEntry ? "Save this day" : "Update this day") : "Save today's entry")}

  );
